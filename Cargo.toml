[workspace]
members = [
    "executor/exec-core",
    "executor/exec-store",
    "executor/exec-ipc",
    "executor/exec-svc",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

# Money-path arithmetic must panic rather than wrap in shipped builds.
[profile.release]
overflow-checks = true
