  /positions/{positionId}/close:
    parameters:
      - $ref: "#/components/parameters/TraderBotUserAgent"
    post:
      tags:
        - معاملات تعهدی
      summary: بستن موقعیت
      description: |
        برای بستن موقعیت، یک سفارش در جهت عکس موقعیت اولیه ثبت می‌شود:

        - موقعیت فروش با ثبت سفارش خرید تعهدی بسته می‌شود.
        - موقعیت خرید با ثبت سفارش فروش تعهدی بسته می‌شود.

        پس از تکمیل سفارش تسویه، تعهد موقعیت بازپرداخت شده و سود یا زیان
        نهایی به کیف‌پول تعهدی کاربر واریز می‌شود.
        
        <div class="alert alert--warning">
        **محدودیت فراخوانی:**  ۳۰۰ درخواست در ۱۰ دقیقه
        </div>
         <br/>
        <div class="alert alert--secondary">
          #### API Key 
          در صورت استفاده از API Key، دسترسی `TRADE` روی کلید الزامی است.
        </div>
        <br/>

        ### سفارش تسویه از دارایی کلی موقعیت تأمین اعتبار می‌شود و باید شرایط زیر را داشته باشد:

        - مجموع مقدار باز سفارش‌های تسویه از تعهد باقی‌مانده موقعیت بیشتر نباشد:
          `liability - liabilityInOrder`
        - ارزش کل سفارش‌های باز تسویه از دارایی آزاد موقعیت بیشتر نباشد:
          `totalAsset - assetInOrder`
        - سفارش‌های تسویه جزئی باید حداقل مقدار سفارش بازار را رعایت کنند.
        - در تسویه نهایی، تمام تعهد باقی‌مانده باید با `دقت حداکثر ۱۰ رقم اعشار` ارسال شود.



        #### انواع اجرای سفارش:

        - `limit`: سفارش با قیمت معین
        - `market`: سفارش با قیمت بازار
        - `stop_limit`: سفارش حد ضرر با قیمت معین
        - `stop_market`: سفارش حد ضرر با قیمت بازار
        - `oco`: ثبت هم‌زمان سفارش با قیمت معین و سفارش حد ضرر

        #### شرایط سفارش OCO

        - شرط قیمت سفارش OCO برای بستن موقعیت فروش با سفارش خرید:

        `price < marketPrice < stopPrice و stopLimitPrice`

        - شرط قیمت سفارش OCO برای بستن موقعیت خرید با سفارش فروش:

        `price > marketPrice > stopPrice و stopLimitPrice`


      security:
        - TokenAuth: []
        - KeyAuth: []
          SignatureAuth: []
          TimestampAuth: []

      parameters:
        - $ref: "#/components/parameters/PositionId"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PositionCloseRequest"

      responses:
        "200":
