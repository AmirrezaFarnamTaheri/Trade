openapi: 3.0.3
info:
  title: API معاملات تعهدی نوبیتکس
  version: "1.0.0"
  description: |
    APIهای مربوط به معاملات تعهدی (Margin)، استخرهای مشارکت، انتقال به کیف‌پول تعهدی،
    سفارش‌گذاری تعهدی و مدیریت موقعیت‌ها.

servers:
  - url: https://apiv2.nobitex.ir
  - url: https://testnetapiv2.nobitex.ir

tags:
  - name: معاملات تعهدی
    description: بازار تعهدی، استخرها، سفارش‌ها و موقعیت‌ها

paths:
  /margin/markets/list:
    parameters:
      - $ref: "#/components/parameters/TraderBotUserAgent"
    get:
      tags:
        - معاملات تعهدی
      summary: مشاهده بازارهای معاملات تعهدی
      description: |
        لیست بازارهای پشتیبانی‌شده برای معاملات تعهدی را برمی‌گرداند.

        <div class="alert alert--warning">
        **محدودیت فراخوانی:** ۳۰ درخواست در دقیقه
        </div>
        <br/>

        کلیدهای شیء `markets` نماد بازار هستند؛ برای نمونه:

        - `BTCIRT`: بازار بیت‌کوین/ریال
        - `BTCUSDT`: بازار بیت‌کوین/تتر
        - `DOGEIRT`: بازار دوج‌کوین/ریال

        این متد بدون احراز هویت نیز قابل استفاده است. در صورت ارسال توکن معتبر، پاسخ می‌تواند
        با توجه به سطح کاربری، عمق بازار، دسترسی به استخرهای خصوصی و محدودیت‌های اختصاصی کاربر
        شخصی‌سازی شود.

        **نکات مهم:**
        - مقدار `maxLeverage` ممکن است بین کاربران مختلف متفاوت باشد.
        - نرخ تمدید روزانه می‌تواند بر اساس سمت موقعیت و ارزش دارایی وکالت‌گرفته‌شده پله‌ای باشد.
        - فیلدهای `sellPositionFeeRate`، `buyPositionFeeRate` و سقف‌های وکالت ممکن است فقط
          در پاسخ احراز هویت‌شده یا در شرایط خاص موجود باشند؛ بنابراین کلاینت باید نبودن یا
          `null` بودن آن‌ها را مدیریت کند.
        <br/>

      security:
        - {}
        - TokenAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarginMarketsDetailsRequest"
            example:
              details: true
      responses:
        "200":
          description: موفق
          content:
            application/json:
              example:
                status: ok
                markets:
                  BTCUSDT:
                    srcCurrency: btc
                    dstCurrency: usdt
                    positionFeeRate: "0.001"
                    maxLeverage: "5"
                    sellEnabled: true
                    buyEnabled: true
                    sellPositionFeeRate: "0.001"
                    buyPositionFeeRate: "0.001"
                    sellMaxDelegation: "100000"
                    buyMaxDelegation: "100000"
                    buyMaxDelegationInSrcCurrency: "0.002"

              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  markets:
                    type: object
                    additionalProperties:
                      $ref: "#/components/schemas/MarginMarketSetting"


  /liquidity-pools/list:
    parameters:
      - $ref: "#/components/parameters/TraderBotUserAgent"
    get:
      tags:
        - معاملات تعهدی
      summary: مشاهده استخرهای مشارکت ارزی فعال 
      description: |
        استخرهای مشارکت موجودی مورد نیاز برای اعطای وکالت خرید و فروش تعهدی را تامین می‌کنند. ظرفیت مشارکت افراد در معاملات تعهدی را موجودی استخرها تعیین می‌کنند. استخرها ممکن است در زمان‌هایی فعال و غیرفعال شوند. در استخرهای غیرفعال امکان ثبت سفارش جدید تعهدی وجود ندارد (اما بستن موقعیت همچنان میسر است). برای دریافت ظرفیت استخرهای فعال از این درخواست استفاده نمایید.
        <div class="alert alert--warning">
        **محدودیت فراخوانی:** ۱۲ درخواست در دقیقه
        </div>
        <br/>
      security:
        - {}
        - TokenAuth: []      
      responses:
        "200":
          description: موفق
          content:
            application/json:
              example:
                status: ok
                pools:
                  btc:
                    id: 1
                    capacity: "40"
                    filledCapacity: "40"
                    currentProfit: 1320419257
                    APR: "6.58"
                    profitPeriod: 31
                    startDate: "2026-07-23"
                    endDate: "2026-08-22"
                    profitDate: "2026-08-23"
                    minDelegation: "0.000008"
                    maxDelegation: "0.16529"
                    hasDelegate: false
                    hasActiveAlert: false
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  pools:
                    type: object
                    additionalProperties:
                      $ref: "#/components/schemas/LiquidityPool"

  /wallets/transfer:
    parameters:
      - $ref: "#/components/parameters/TraderBotUserAgent"
    post:
      tags:
        - معاملات تعهدی
      summary: انتقال پول بین کیف‌پول‌های کاربر
      description: |
        وجوه تضمین قبل از دریافت وکالت خرید و فروش تعهدی باید در کیف‌پول تعهدی قرار گیرند. برای انتقال موجودی میان دو کیف‌پول اسپات و تعهدی از این درخواست استفاده نمایید.

        انتقال وجه در مسیرهای زیر پشتیبانی می‌شود:

        - از کیف‌پول اسپات (`spot`) به کیف‌پول تعهدی (`margin`)
        - از کیف‌پول تعهدی (`margin`) به کیف‌پول اسپات (`spot`)

        <div class="alert alert--warning">
        **محدودیت فراخوانی:** ۱۰ درخواست در دقیقه
        </div>
        <br/>

        ### **نکات و ملاحظات**
        نوع کیف‌پول مبدا و مقصد نباید یکسان باشد.
        کیف‌پول تعهدی ضمن اولین انتقال به آن ایجاد می‌شود. پس از آن موجودی این کیف‌پول را می‌توان از طریق لیست کیف‌پول‌ها مشاهده کرد.

        <br/>


      security:
        - TokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletTransferRequest"
      responses:
        "200":
          description: |
            پاسخ درخواست.
            <br/>
            **توجه**: خطاهای بیزینسی نیز با status code 200 برگردانده می‌شوند.

          content:
            application/json:
              examples:
                success_response:
                  summary: انتقال موفق
                  value:
                    status: ok
                    srcWallet:
                      id: 5678
                      currency: usdt
                      balance: "250.5000000000"
                      blockedBalance: "20.0000000000"
                      activeBalance: "230.5000000000"
                      rialBalance: 728250000
                      rialBalanceSell: 730000000
                      type: margin
                    dstWallet:
                      id: 1234
                      currency: usdt
                      balance: "85.7500000000"
                      blockedBalance: "15.2500000000"
                      activeBalance: "70.5000000000"
                      rialBalance: 249750000
                      rialBalanceSell: 251000000
                      type: spot
                
                fail InsufficientBalance:
                  summary: موجودی کافی نیست
                  value:
                    status: failed
                    code: InsufficientBalance
                    message: mount cannot exceed active balance
                
                fail SameDestination:
                  summary: مبدا و مقصد یک نوع هستند
                  value:
                    status: failed
                    code: SameDestination
                    message: Dst wallet must be different from src wallet
                fail InvalidAmount:
                  summary: مقدار انتقال نامعتبر است
                  value:
                    status: failed
                    code: InvalidAmount
                    message: Amount must be positive

                fail WalletNotFound:
                  summary: کیف پول ارسال شده برای انتقال پیدا نشد
                  value:
                    status: failed
                    code: WalletNotFound
                    message: Dst/Src wallet not found
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WalletTransferResponse"
                  - $ref: "#/components/schemas/MarginFailedResponse"
        "400":
          description: خطای فرمت درخواست
          content:
            application/json:
              example:
                  status: failed
                  code: ParseError
                  message: فرمت ورودی‌ها مطابق فرمت خواسته شده نیست.
              schema:
                $ref: "#/components/schemas/MarginFailedResponse"


  /margin/v2/delegation-limit:
    parameters:
      - $ref: "#/components/parameters/TraderBotUserAgent"
    get:
      tags:
        - معاملات تعهدی
      summary: دریافت محدودیت وکالت بر اساس بازار
      description: |
        برای دریافت سقف باقی‌مانده وکالت کاربر در یک بازار تعهدی از این درخواست استفاده کنید. 
         در پاسخ، محدودیت‌های باقی‌مانده به تفکیک سمت `buy` و `sell` و برای هر اهرم مجاز بازار بازگردانده می‌شود. در سمت `sell` واحد `limit` برابر رمزارز مبدا بازار و در سمت `buy` واحد limit برابر رمزارز مقصد بازار است.

        <div class="alert alert--warning">
        **محدودیت فراخوانی:** ۱۲ درخواست در دقیقه
        </div>
        <br/>
        <div class="alert alert--secondary">
          #### API Key 
          در صورت استفاده از API Key، دسترسی `READ` روی کلید الزامی است.
        </div>
        <br/>
        ### نکات و ملاحظات
        نمونه پاسخ  در مثال پاسخ‌ها گذاشته شده و آرایه هر سمت از اهرم `1` تا حداکثر اهرم مجاز آن بازار، با گام `0.5` ادامه پیدا می‌کند.
        مقدار `limit` در هر ورودی، سقف باقی‌مانده قابل استفاده برای همان سمت و همان اهرم است.
        با باز بودن موقعیت‌ها و سفارش‌های تعهدی، این مقادیر کاهش می‌یابند و با بستن یا تسویه آن‌ها دوباره افزایش پیدا می‌کنند.
        در سفارش فروش تعهدی، مقدار سفارش باید از `sell.limit` اهرم انتخابی کمتر یا مساوی باشد.
        در سفارش خرید تعهدی، ارزش کل سفارش `(price × amount)` باید از `buy.limit` اهرم انتخابی کمتر یا مساوی باشد.

      security:
        - TokenAuth: []
        - KeyAuth: []
          SignatureAuth: []
          TimestampAuth: []
      parameters:
        - name: market
          in: query
          required: true
          schema:
            type: string
          description: نماد بازار، مانند `BTCIRT`.
          example: BTCIRT
      responses:
        "200":
          description: |
            پاسخ درخواست.
            <br/>
            **توجه**: خطاهای بیزینسی نیز با status code 200 برگردانده می‌شوند.
          content:
            application/json:
              examples:
                success:
                  summary: پاسخ موفق
                  value:
                    status: ok
                    limits:
                      sell:
                        - leverage: "1"
                          limit: "0.423"
                        - leverage: "1.5"
                          limit: "0.396"
                        - leverage: "2"
                          limit: "0.37"
                        - leverage: "2.5"
                          limit: "0.343"
                        - leverage: "3"
                          limit: "0.317"
                        - leverage: "3.5"
                          limit: "0.29"
                        - leverage: "4"
                          limit: "0.264"
                        - leverage: "4.5"
                          limit: "0.238"
                        - leverage: "5"
                          limit: "0.211"

                      buy:
                        - leverage: "1"
                          limit: "476000000"
                        - leverage: "1.5"
                          limit: "446000000"
                        - leverage: "2"
                          limit: "416000000"
                        - leverage: "2.5"
                          limit: "387000000"
                        - leverage: "3"
                          limit: "357000000"
                        - leverage: "3.5"
                          limit: "327000000"
                        - leverage: "4"
                          limit: "297000000"
                        - leverage: "4.5"
                          limit: "268000000"
                        - leverage: "5"
                          limit: "238000000"
                fail InvalidMarket:
                  summary: مارکت نامعتبر
                  value:
                    status: failed
                    code: InvalidMarket
                    message: InvalidMarket
                fail UnsupportedMarginSymbol:
                  summary: مارکت از مارجین پشتیبانی نمی‌کند
                  value:
                    status: failed
                    code: UnsupportedMarginSymbol
                    message: UnsupportedMarginSymbol
                fail TradeLimitation:
                  summary: کاربر سطح احراز کافی ندارد.
                  value:
                    status: failed
                    code: TradeLimitation
                    message: TradeLimitation
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MarginDelegationLimitV2Response"
                  - $ref: "#/components/schemas/MarginFailedResponse"


  /margin/orders/add:
    parameters:
      - $ref: "#/components/parameters/TraderBotUserAgent"
    post:
      tags:
        - معاملات تعهدی
      summary: درج سفارش تعهدی
      description: |
       سفارش‌گذاری تعهدی در نوبیتکس امکان ایجاد موقعیت معاملاتی خرید یا فروش با استفاده از اعتبار معاملاتی یا اهرم را فراهم می‌کند.
        کاربر با تعیین بازار، جهت سفارش، مقدار، قیمت و میزان اهرم می‌تواند موقعیت معاملاتی موردنظر خود را ایجاد کند.
        در سفارش‌های تعهدی، اجرای سفارش به شرایط بازار، قیمت تعیین‌شده، نقدینگی موجود و قوانین بازار مربوطه بستگی دارد.


        <div class="alert alert--warning">
        **محدودیت فراخوانی:**  ۳۰۰ درخواست در ۱۰ دقیقه

        **نکته مهم:** این اندپوینت محدودیت فراخوانی مشترک با سفارش گذاری در بازار اسپات دارد
        </div>
         <br/>
        <div class="alert alert--secondary">
          #### API Key 
          در صورت استفاده از API Key، دسترسی `TRADE` روی کلید الزامی است.
        </div>
        <br/>


        ### انواع سفارش‌ها

        | نوع سفارش | توضیحات |
        |---|---|
        | `Limit` | ثبت سفارش با قیمت مشخص؛ سفارش پس از رسیدن بازار به قیمت تعیین‌شده اجرا می‌شود. |
        | `Market` | ثبت سفارش بدون تعیین قیمت و اجرای آن با بهترین قیمت موجود بازار. |
        | `Stop Market` | سفارش شرطی که پس از رسیدن قیمت به نقطه فعال‌سازی، به سفارش `Market` تبدیل می‌شود. |
        | `Stop Limit` | سفارش شرطی که پس از رسیدن قیمت به نقطه فعال‌سازی، یک سفارش `Limit` ایجاد می‌کند. |
        | `OCO` | ترکیبی از سفارش‌های `Limit` و `Stop Limit`؛ با اجرای یکی، سفارش دیگر به‌صورت خودکار لغو می‌شود. |

        ### شرایط سفارش OCO
        **خرید:** <span dir="ltr"><code>price &lt; آخرین قیمت بازار &lt; stopPrice و stopLimitPrice</code></span>

        **فروش:** <span dir="ltr"><code>price &gt; آخرین قیمت بازار &gt; stopPrice و stopLimitPrice</code></span>

        <br/>

      security:
        - TokenAuth: []
        - KeyAuth: []
          SignatureAuth: []
          TimestampAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/MarginLimitOrderRequest"
                - $ref: "#/components/schemas/MarginMarketOrderRequest"
                - $ref: "#/components/schemas/MarginStopMarketOrderRequest"
                - $ref: "#/components/schemas/MarginStopLimitOrderRequest"
                - $ref: "#/components/schemas/MarginOCOOrderRequest"
      responses:
        "200":
          description: |
            پاسخ درخواست.
            <br/>
            **توجه**: خطاهای بیزینسی نیز با status code 200 برگردانده می‌شوند.
            
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MarginOrderResponseSingle"
                  - $ref: "#/components/schemas/MarginOrderResponseOCO"
                  - $ref: "#/components/schemas/MarginFailedResponse"
              
              examples:
                successfulMarginOrder:
                  summary: ثبت موفق سفارش تعهدی
                  description: سفارش فروش تعهدی با موفقیت ثبت شده است.
                  value:
                    status: ok
                    order:
                      id: 25
                      type: sell
                      execution: Limit
                      tradeType: Margin
                      srcCurrency: btc
                      dstCurrency: rls
                      price: "6400000000"
                      amount: "0.01"
                      status: Active
                      totalPrice: "0"
                      totalOrderPrice: "64000000"
                      matchedAmount: "0"
                      unmatchedAmount: "0.01"
                      leverage: "2"
                      side: open
                      partial: false
                      fee: "0"
                      created_at: "2022-10-20T11:36:13.592827+00:00"
                      averagePrice: "0"

                tradeLimitation:
                  summary: ناکافی بودن سطح احراز هویت
                  description: کاربر سطح احراز کافی ندارد.
                  value:
                    status: failed
                    code: TradeLimitation
                    message: TradeLimitation

                invalidMarketPair:
                  summary: زوج بازار نامعتبر
                  description: زوج مبدا/مقصد بازار در میان بازارهای نوبیتکس وجود ندارد.
                  value:
                    status: failed
                    code: InvalidMarketPair
                    message: Market Validation Failed

                marketValidationFailed:
                  summary: اعتبارسنجی بازار ناموفق بود
                  description: بازار بسته شده یا هنوز باز نشده است.
                  value:
                    status: failed
                    code: MarketClosed
                    message: Market Validation Failed

                marketClosed:
                  summary: بازار بسته است
                  description: بازار بسته شده یا هنوز باز نشده است.
                  value:
                    status: failed
                    code: MarketClosed
                    message: Market is currently closed!

                marketNotOpened:
                  summary: بازار هنوز باز نشده است
                  description: بازار بسته شده یا هنوز باز نشده است.
                  value:
                    status: failed
                    code: MarketClosed
                    message: Market is not opened yet!

                marginClosed:
                  summary: معاملات تعهدی فعال نیست
                  description: معاملات خرید/فروش تعهدی بسته شده یا باز نشده است.
                  value:
                    status: failed
                    code: MarginClosed
                    message: Margin Trading Not Open

                unsupportedMarginSrc:
                  summary: رمزارز مبدأ پشتیبانی نمی‌شود
                  description: رمزارز درخواستی برای معاملات خرید/فروش تعهدی پشتیبانی نمی‌شود.
                  value:
                    status: failed
                    code: UnsupportedMarginSrc
                    message: Unsupported Margin Src Currency

                unsupportedMarginDst:
                  summary: رمزارز مقصد پشتیبانی نمی‌شود
                  description: رمزارز مقصد برای معاملات خرید/فروش تعهدی پشتیبانی نمی‌شود.
                  value:
                    status: failed
                    code: UnsupportedMarginDst
                    message: Unsupported Margin Dst Currency

                invalidOrderPrice:
                  summary: قیمت سفارش نامعتبر
                  description: قیمت سفارش، اعتبارسنجی موردنیاز بازار را با موفقیت طی نکرده است.
                  value:
                    status: failed
                    code: InvalidOrderPrice
                    message: Price Validation Failed

                amountUnavailable:
                  summary: مقدار درخواستی موجود نیست
                  description: مقدار مورد تقاضا برای اخذ وکالت فروش در استخر موجود نیست.
                  value:
                    status: failed
                    code: AmountUnavailable
                    message: Amount Unavailable

                exceedDelegationLimit:
                  summary: مقدار بیشتر از سقف وکالت
                  description: مقدار از سقف مجاز فروش باقی‌مانده کاربر بیشتر است.
                  value:
                    status: failed
                    code: ExceedDelegationLimit
                    message: Amount exceeds delegation limit

                exceedSellLimit:
                  summary: مقدار بیشتر از سقف فروش
                  description: مقدار سفارش از سقف مجاز فروش بیشتر است.
                  value:
                    status: failed
                    code: ExceedSellLimit
                    message: Amount Exceeds Sell Limit

                insufficientBalance:
                  summary: موجودی ناکافی
                  description: موجودی کیف‌پول تعهدی کاربر برای تامین وجه تضمین به اندازه مبلغ کل سفارش کافی نیست.
                  value:
                    status: failed
                    code: InsufficientBalance
                    message: Insufficient Balance

                leverageUnavailable:
                  summary: عدم دسترسی کاربر به ضریب وکالت
                  description: کاربر محدودیت استفاده از ضریب وکالت از جانب پشتیبانی دارد.
                  value:
                    status: failed
                    code: LeverageUnavailable
                    message: LeverageUnavailable

                userLeverageTooHigh:
                  summary: ضریب وکالت بیشتر از سقف کاربر
