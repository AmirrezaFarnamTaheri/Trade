            مثال: در بازار BTC/USDT مقدار این فیلد usdt است.
          example: usdt

        type:
          type: string
          description: |
            جهت سفارش:
            - buy: ایجاد موقعیت خرید
            - sell: ایجاد موقعیت فروش
          enum:
            - buy
            - sell
          example: sell

        leverage:
          type: string
          description: |
            ضریب اهرم مورد استفاده در معامله تعهدی.
            مقدار بالاتر باعث افزایش حجم موقعیت نسبت به سرمایه اولیه می‌شود.
          default: "1"
          example: "2"

        amount:
          type: string
          description: |
            مقدار دارایی موردنظر برای معامله.
            پس از رسیدن قیمت بازار به قیمت فعال‌سازی، یک سفارش Limit با این مقدار ایجاد می‌شود.
          example: "0.01"

        price:
          type: string
          description: |
            قیمت سفارش Limit که پس از فعال‌شدن سفارش Stop Limit ثبت می‌شود.
            اجرای سفارش در این قیمت یا قیمت بهتر، به شرایط و نقدینگی بازار بستگی دارد.
          example: "12500000000"

        stopPrice:
          type: string
          description: |
            قیمت فعال‌سازی سفارش Stop Limit.
            زمانی که قیمت بازار به این مقدار برسد، یک سفارش Limit با قیمت تعیین‌شده در فیلد price ایجاد می‌شود.
          example: "12600000000"

        clientOrderId:
          type: string
          nullable: true
          description: |
            شناسه اختیاری سفارش که توسط کاربر برای پیگیری و مدیریت سفارش ایجاد می‌شود.
            این مقدار باید در میان سفارش‌های باز کاربر یکتا باشد.

            محدودیت‌ها:
            - حداکثر طول مقدار ۳۲ نویسه است.
            - فقط حروف انگلیسی (A-Z و a-z)، اعداد (0-9) و خط تیره (-) مجاز است.
            - مقدار باید با الگوی زیر مطابقت داشته باشد:
              ^[A-Za-z0-9-]+$
          example: my-order-123


    MarginOCOOrderRequest:
      title: سفارش OCO
      type: object

      required:
        - execution
        - mode
        - srcCurrency
        - dstCurrency
        - amount
        - price
        - stopPrice
        - stopLimitPrice

      properties:
        execution:
          type: string
          description: |
            نوع سفارش پایه. برای سفارش OCO مقدار این فیلد باید برابر با limit باشد.
          enum:
            - limit
          example: limit

        mode:
          type: string
          description: |
            حالت ثبت سفارش. برای ایجاد سفارش OCO مقدار این فیلد باید برابر با oco باشد.
          enum:
            - oco
          example: oco

        srcCurrency:
          type: string
          description: |
            نماد رمزارز پایه بازار که سفارش بر روی آن ایجاد می‌شود.
            مثال: در بازار BTC/USDT مقدار این فیلد btc است.
          example: btc

        dstCurrency:
          type: string
          description: |
            ارز مقابل بازار که قیمت سفارش بر اساس آن تعیین می‌شود.
            مثال: در بازار BTC/USDT مقدار این فیلد usdt است.
          example: usdt

        type:
          type: string
          description: |
            جهت سفارش:
            - buy: ایجاد موقعیت خرید
            - sell: ایجاد موقعیت فروش
          enum:
            - buy
            - sell
          example: sell

        leverage:
          type: string
          description: |
            ضریب اهرم مورد استفاده در معامله تعهدی.
            مقدار بالاتر باعث افزایش حجم موقعیت نسبت به سرمایه اولیه می‌شود.
          default: "1"
          example: "2"

        amount:
          type: string
          description: |
            مقدار دارایی موردنظر برای معامله.
            این مقدار برای هر دو بخش Limit و Stop Limit سفارش OCO استفاده می‌شود.
          example: "0.01"

        price:
          type: string
          description: |
            قیمت بخش Limit سفارش OCO.

            شرایط مقداردهی:
            - در سفارش خرید، این مقدار باید کمتر از آخرین قیمت بازار باشد.
            - در سفارش فروش، این مقدار باید بیشتر از آخرین قیمت بازار باشد.
          example: "13400000000"

        stopPrice:
          type: string
          description: |
            قیمت فعال‌سازی بخش Stop Limit سفارش OCO.
            با رسیدن قیمت بازار به این مقدار، سفارش Stop Limit فعال می‌شود.

            شرایط مقداردهی:
            - در سفارش خرید، این مقدار باید بیشتر از آخرین قیمت بازار باشد.
            - در سفارش فروش، این مقدار باید کمتر از آخرین قیمت بازار باشد.
          example: "12600000000"

        stopLimitPrice:
          type: string
          description: |
            قیمت سفارش Limit که پس از رسیدن بازار به stopPrice ثبت می‌شود.

            شرایط قیمت سفارش OCO:
            - خرید: price کمتر از آخرین قیمت بازار است و آخرین قیمت بازار نیز باید کمتر از stopPrice و stopLimitPrice باشد.
            - فروش: price بیشتر از آخرین قیمت بازار است و آخرین قیمت بازار نیز باید بیشتر از stopPrice و stopLimitPrice باشد.

            با اجرای یکی از بخش‌های Limit یا Stop Limit، بخش دیگر به‌صورت خودکار لغو می‌شود.
          example: "12500000000"

    PositionCloseRequest:
