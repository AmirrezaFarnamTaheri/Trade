    get:
      tags:
        - معاملات تعهدی
      summary: مشاهده لیست موقعیت‌ها
      description: |
        برای دریافت لیست موقعیت‌های باز و تاریخچه موقعیت‌های پایان‌یافته
        از این درخواست استفاده کنید.

         <div class="alert alert--warning">
        **محدودیت فراخوانی:**  ۳۰ درخواست در ۱۰ دقیقه
        </div>
         <br/>
        <div class="alert alert--secondary">
          #### API Key 
          در صورت استفاده از API Key، دسترسی `TRADE` روی کلید الزامی است.
        </div>
        <br/>


        مقدار پارامتر `status` مشخص می‌کند چه نوع موقعیت‌هایی برگردانده شوند:

        - `active`: موقعیت‌های باز و تسویه‌نشده
        - `past`: موقعیت‌های بسته، لیکوییدشده یا منقضی‌شده که تسویه شده‌اند


        **صفحه‌بندی:** دارد؛ اندازه پیش‌فرض هر صفحه ۵۰ موقعیت است.

        ممکن است بین زمان لیکویید یا منقضی‌شدن یک موقعیت و زمان تسویه کامل آن
        توسط سفارش‌های سیستمی فاصله کوتاهی وجود داشته باشد. در این بازه،
        موقعیت لیکوییدشده یا منقضی‌شده همچنان در فهرست موقعیت‌های فعال
        برگردانده می‌شود.

      security:
        - TokenAuth: []
        - KeyAuth: []
          SignatureAuth: []
          TimestampAuth: []

      parameters:
        - name: srcCurrency
          in: query
          required: false
          description: |
            رمزارز مبدأ بازار.

            در صورت ارسال‌نشدن این پارامتر، موقعیت‌های همه رمزارزهای مبدأ
            برگردانده می‌شوند.
          schema:
            type: string
          example: btc

        - name: dstCurrency
          in: query
          required: false
          description: |
            ارز مقصد بازار.

            در صورت ارسال‌نشدن این پارامتر، موقعیت‌های همه ارزهای مقصد
            برگردانده می‌شوند.
          schema:
            type: string
          example: rls

        - name: status
          in: query
          required: false
          description: |
            نوع موقعیت‌های درخواستی.

            - `active`: موقعیت‌های باز و تسویه‌نشده
            - `past`: موقعیت‌های تسویه‌شده، بسته، لیکوییدشده یا منقضی‌شده
          schema:
            type: string
            default: active
            enum:
              - active
              - past
          example: active

        - name: page
          in: query
          required: false
          description: شماره صفحه در نتایج صفحه‌بندی‌شده.
          schema:
            type: integer
            minimum: 1
          example: 1

        - name: pageSize
          in: query
          required: false
          description: تعداد موقعیت‌های برگردانده‌شده در هر صفحه.
          schema:
            type: integer
            minimum: 1
            default: 50
          example: 50
  
      responses:
        "200":
          description: پاسخ موفق لیستی از پوزیشن‌های کاربر را بر می‌گرداند
