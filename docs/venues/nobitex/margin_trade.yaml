                  description: ارزش کل سفارش از دارایی آزاد موقعیت بیشتر است.
                  value:
                    status: failed
                    code: ExceedTotalAsset
                    message: Total Price Exceeds Position Total Asset

                badPrice:
                  summary: قیمت نامعقول
                  description: قیمت سفارش با محدوده قابل قبول بازار مطابقت ندارد.
                  value:
                    status: failed
                    code: BadPrice
                    message: Order Validation Failed

                smallOrder:
                  summary: سفارش کوچک
                  description: سفارش حداقل اندازه مجاز بازار را رعایت نکرده است.
                  value:
                    status: failed
                    code: SmallOrder
                    message: Order Validation Failed

                priceConditionFailed:
                  summary: برقرار نبودن شرط قیمت
                  description: |
                    رابطه قیمت سفارش، قیمت توقف و قیمت فعلی بازار معتبر نیست.
                  value:
                    status: failed
                    code: PriceConditionFailed
                    message: Order Validation Failed

        
        "400":
          description: ورودی نامعتبر
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarginFailedResponse"
              examples:
                parseError:
                  summary: فرمت نامعتبر ورودی
                  value:
                    status: failed
                    code: ParseError
                    message: Invalid monetary value

        "404":
          description: موقعیت باز موردنظر پیدا نشد.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarginFailedResponse"

              examples:
                noOpenPosition:
                  summary: موقعیت فعال وجود ندارد
                  description: |
                    موقعیتی با این شناسه وجود ندارد یا موقعیت قبلاً بسته شده است.
                  value:
                    status: failed
                    code: NoOpenPosition
                    message: No open position found.


  /positions/{positionId}/edit-collateral:
    parameters:
      - $ref: "#/components/parameters/TraderBotUserAgent"

    post:
      tags:
        - معاملات تعهدی
      summary: ویرایش وجه تضمین موقعیت باز
      description: |
        برای افزایش یا کاهش وجه تضمین یک موقعیت تعهدی باز استفاده می‌شود.

        <div class="alert alert--warning">
        **محدودیت فراخوانی:**  ۶۰ درخواست در دقیقه
        </div>
         <br/>
        <div class="alert alert--secondary">
          #### API Key 
          در صورت استفاده از API Key، دسترسی `TRADE` روی کلید الزامی است.
        </div>
        <br/>
        ### نکات و ملاحظات
         -        در صورتی که موقعیت در سوددهی باشد (نسبت تعهد > نسبت تعهد اولیه = ضریب / 1 + 1)، کاربر می‌تواند مازاد وجه تضمین خود را تا نسبت تعهد اولیه از بلوکه در بیاورد. -- سود تنها زمان بسته شدن کامل موقعیت قابل دستیابی است.
        -         در صورتی که موقعیت به نقطه لیکوئید شدن نزدیک باشد و کاربر بخواهد موقعیت خود (به امید تغییر جهت بازار) باز نگهدارد، می‌تواند با افزایش وجه تضمین خود، قیمت لیکوئید شدن خود را بهبود دهد.

      operationId: editPositionCollateral

      security:
        - TokenAuth: []
        - KeyAuth: []
          SignatureAuth: []
          TimestampAuth: []

      parameters:
        - $ref: "#/components/parameters/PositionId"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PositionCollateralEditRequest"

      responses:
        "200":
          description: |
            پاسخ درخواست.
            <br/>
            **توجه**: خطاهای بیزینسی نیز با status code 200 برگردانده می‌شوند.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required:
                      - status
                      - position
                    properties:
                      status:
                        type: string
                        enum: [ok]
                        example: ok
                      position:
                        $ref: "#/components/schemas/Position"
                  - $ref: "#/components/schemas/MarginFailedResponse"
              examples:
                success:
                  summary: پاسخ موفق
                  value:
                    status: ok
                    position:
                      id: 128
                      createdAt: "2022-10-20T11:36:13.604420+00:00"
                      srcCurrency: btc
                      dstCurrency: rls
                      side: sell
                      status: Open
                      marginType: Isolated Margin
                      collateral: "230000000"
                      leverage: "2"
                      openedAt: "2022-10-20T11:36:16.562038+00:00"
                      closedAt: null
                      liquidationPrice: "12230682570"
                      entryPrice: "6400000000"
                      exitPrice: "6100000000"
                      PNL: null
                      delegatedAmount: "0.02"
                      liability: "0.0200300451"
                      totalAsset: "257023981"
                      marginRatio: "2.03"
                      liabilityInOrder: "0"
                      assetInOrder: "0"
                      unrealizedPNL: "23423565"
                      unrealizedPNLPercent: "10.18"
                      expirationDate: "2022-11-20"
                      extensionFee: "320000"
                      markPrice: "6090000000"
                lowMarginRatio:
                  summary: کاهش بیش از حد وجه تضمین.کاهش وجه تضمین باعث کمتر شدن نسبت تعهد از حد مجاز می‌شود.

                  value:
                    status: failed
                    code: LowMarginRatio
                    message: Margin ratio must be above .... after collateral change
                insufficientBalance:
                  summary: موجودی ناکافی
                  value:
                    status: failed
                    code: InsufficientBalance
                    message: Insufficient margin active balance

        "400":
          description: ورودی نامعتبر یا عدم امکان تغییر وجه تضمین
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarginFailedResponse"
              examples:
                parseError:
                  summary: فرمت نامعتبر ورودی
                  value:
                    status: failed
                    code: ParseError
                    message: فرمت ورودی‌ها معتبر نیست.
        "422":
          description: ورودی نامعتبر یا عدم امکان تغییر وجه تضمین
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarginFailedResponse"
              examples:
                tryAgainLater:
                  summary: عدم امکان موقت تغییر وجه تضمین
                  value:
                    status: failed
                    code: TryAgainLater
                    message: Collateral change is temporarily unavailable
        "404":
          description: موقعیت باز پیدا نشد.
          

  
components:
  parameters:
    TraderBotUserAgent:
      name: User-Agent
      in: header
      required: false
      description: |
        برای شناسایی بات، این هدر را در همه درخواست‌های HTTP بات با الگوی
        `TraderBot/<name-and-version>` ارسال کنید. این هدر هنگام ورود خودکار با
        `captcha=api` الزامی و در سایر فراخوانی‌های بات اکیداً توصیه می‌شود.
      schema:
        type: string
      example: TraderBot/MyBot-1.0.0

    PositionId:
      name: positionId
      in: path
      required: true
      schema:
        type: integer
      example: 128

  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: |
        توکن کاربر در قالب `Authorization: Token <token>`.
    KeyAuth:
      type: apiKey
      in: header
      name: Nobitex-Key
      description: کلید عمومی API Key.
    SignatureAuth:
      type: apiKey
      in: header
      name: Nobitex-Signature
      description: امضای Ed25519 به صورت URL-safe Base64.
    TimestampAuth:
      type: apiKey
      in: header
      name: Nobitex-Timestamp
      description: زمان Unix بر حسب ثانیه در UTC.

  schemas:
    MarginMarketsDetailsRequest:
        type: object
        properties:
          details:
            type: boolean
            description: اطلاعات تکمیلی بازار، مانند محدودیت‌های وکالت را برمی‌گرداند.
            example: true
    
    
    MarginMarketSetting:
      type: object
      description: تنظیمات و محدودیت‌های یک بازار معاملات تعهدی
      properties:
        srcCurrency:
          type: string
          description: |
            نماد رمزارز مبدأ یا دارایی پایه بازار، با حروف کوچک.
            این مقدار بخش نخست نماد بازار را مشخص می‌کند.
          example: btc

        dstCurrency:
          type: string
          description: |
            نماد ارز مقصد یا دارایی مظنه بازار، با حروف کوچک؛ معمولاً `rls` یا `usdt`.
          example: usdt

        positionFeeRate:
          type: string
          nullable: true
          pattern: '^[0-9]+(\.[0-9]+)?$'
          description: |
            نرخ کارمزد تمدید روزانه موقعیت به‌صورت عدد اعشاری رشته‌ای.
            برای نمونه، مقدار `0.001` معادل ۰٫۱ درصد است.

            این مقدار می‌تواند `null` باشد. اگر نرخ هر سمت به‌صورت جداگانه در
            `sellPositionFeeRate` و `buyPositionFeeRate` ارائه شده باشد، کلاینت می‌تواند
            از نرخ متناظر با سمت موقعیت استفاده کند.
          example: "0.001"

        maxLeverage:
          type: string
          pattern: '^[0-9]+(\.[0-9]+)?$'
          description: |
            بیشینه ضریب مجاز اهرم در این بازار. مقدار دقیق می‌تواند به عمق بازار،
            سطح کاربری، ظرفیت استخرها و دسترسی‌های کاربر وابسته باشد.
          example: "5"

        sellEnabled:
          type: boolean
          description: آیا ایجاد موقعیت فروش تعهدی در این بازار فعال است؟
          example: true

        buyEnabled:
          type: boolean
          description: آیا ایجاد موقعیت خرید تعهدی در این بازار فعال است؟
          example: true

        sellPositionFeeRate:
          type: string
          nullable: true
          pattern: '^[0-9]+(\.[0-9]+)?$'
          description: |
            نرخ کارمزد تمدید روزانه برای موقعیت فروش تعهدی. این فیلد ممکن است در پاسخ
            عمومی موجود نباشد یا مقدار آن `null` باشد.
          example: "0.001"

        buyPositionFeeRate:
          type: string
          nullable: true
          pattern: '^[0-9]+(\.[0-9]+)?$'
          description: |
            نرخ کارمزد تمدید روزانه برای موقعیت خرید تعهدی. این فیلد ممکن است در پاسخ
            عمومی موجود نباشد یا مقدار آن `null` باشد.
          example: "0.001"

        sellMaxDelegation:
          type: string
          nullable: true
          pattern: '^[0-9]+(\.[0-9]+)?$'
          description: |
            حداکثر مقدار دارایی قابل وکالت برای سمت فروش تعهدی، معمولاً بر حسب
            `srcCurrency`. این مقدار به سطح کاربر، ظرفیت استخر و محدودیت‌های بازار وابسته
            است و ممکن است در پاسخ عمومی موجود نباشد.
          example: "0.002"

        buyMaxDelegation:
          type: string
          nullable: true
          pattern: '^[0-9]+(\.[0-9]+)?$'
          description: |
            حداکثر مقدار دارایی قابل وکالت برای سمت خرید تعهدی، معمولاً بر حسب
            `dstCurrency`. این مقدار ممکن است در پاسخ عمومی موجود نباشد.
          example: "100000"

        buyMaxDelegationInSrcCurrency:
          type: string
          nullable: true
          pattern: '^[0-9]+(\.[0-9]+)?$'
          description: |
            معادل سقف وکالت خرید، تبدیل‌شده به واحد `srcCurrency`. این مقدار برای مقایسه
            مستقیم سقف خرید با مقدار دارایی پایه بازار کاربرد دارد و ممکن است در پاسخ
            عمومی موجود نباشد.
          example: "0.002"

    LiquidityPool:
      properties:
        id:
          type: integer
          format: int64
          example: 1

        capacity:
          type: string
          description: ظرفیت کل استخر
          example: "40"

        filledCapacity:
          type: string
          description: مقدار پرشده از ظرفیت استخر
          example: "32.5"

        currentProfit:
          type: integer
          format: int64
          description: سود فعلی استخر
          example: 1320419257

        APR:
          type: string
          nullable: true
          description: نرخ سود سالانه استخر
          example: "6.58"

        minDelegation:
          type: string
          nullable: true
          description: حداقل مقدار مجاز برای مشارکت در استخر
          example: "0.000008"

        maxDelegation:
          type: string
          nullable: true
          description: حداکثر مقدار مجاز برای مشارکت در استخر
          example: "0.16529"

        startDate:
          type: string
          format: date
          description: تاریخ شروع امکان مشارکت در استخر
          example: "2026-07-23"

        endDate:
          type: string
          format: date
          description: تاریخ پایان امکان مشارکت در استخر
          example: "2026-08-22"

        profitPeriod:
          type: integer
          description: دوره محاسبه سود برحسب روز
          example: 31

        profitDate:
          type: string
          format: date
          description: تاریخ پرداخت یا ثبت سود
          example: "2026-08-23"

        hasDelegate:
          type: boolean
          description: آیا کاربر احراز هویت‌شده در این استخر مشارکت فعال دارد؟
          example: false

        hasActiveAlert:
          type: boolean
          description: آیا کاربر هشدار فعال مربوط به ظرفیت این استخر دارد؟
          example: false
    
    WalletTransferRequest:
      type: object
      required:
        - currency
        - amount
        - src
        - dst
      properties:
        currency:
          type: string
          description: نام ارز
          example: btc
        amount:
          type: string
          description: مقدار مورد نظر برای انتقال
          example: "0.01"
        src:
          type: string
          description: انتقال از کیف مبدا
          enum: [spot, margin]
          example: spot
        dst:
          type: string
          description: انتقال به کیف مقصد
          enum: [spot, margin]
          example: margin

    WalletTransferResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
          example: ok
        srcWallet:
          $ref: "#/components/schemas/Wallet"

        dstWallet:
          $ref: "#/components/schemas/Wallet"

          

    MarginDelegationLimitV2Response:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
          example: ok
        limits:
          type: object
          properties:
            buy:
              type: array
              items:
                $ref: "#/components/schemas/DelegationLimitItem"
            sell:
              type: array
              items:
                $ref: "#/components/schemas/DelegationLimitItem"

    DelegationLimitItem:
      type: object
      properties:
        leverage:
          type: string
          example: "5"
        limit:
          type: string
          example: "0.039062"

    MarginLimitOrderRequest:
      title: سفارش Limit
      type: object

      required:
        - execution
        - srcCurrency
        - dstCurrency
        - amount
        - price
        - type

      properties:
        execution:
          type: string
          description: نوع سفارش. برای سفارش Limit مقدار این فیلد باید برابر با limit باشد.
          example: limit

        srcCurrency:
          type: string
          description: |
            نماد رمزارز پایه بازار که سفارش بر روی آن ایجاد می‌شود.
            مثال: در بازار BTC/USDT مقدار این فیلد btc است.
          example: btc

        dstCurrency:
          type: string
          description: |
            ارز مقابل بازار که قیمت سفارش بر اساس آن تعیین می‌شود.
            مثال: در بازار BTC/USDT مقدار این فیلد usdt است.
          example: usdt

        type:
          type: string
          description: |
            جهت سفارش:
            - buy: ایجاد موقعیت خرید
            - sell: ایجاد موقعیت فروش
          enum:
            - buy
            - sell
          default: sell
          example: sell

        leverage:
          type: string
          description: |
            ضریب اهرم مورد استفاده در معامله تعهدی.
            مقدار بالاتر باعث افزایش حجم موقعیت نسبت به سرمایه اولیه می‌شود.
          default: "1"
          example: "2"

        amount:
          type: string
          description: مقدار دارایی موردنظر برای معامله.
          example: "0.01"

        price:
          type: string
          description: |
            قیمت موردنظر برای ثبت سفارش Limit.
            سفارش تنها در صورت رسیدن قیمت بازار به این مقدار اجرا می‌شود.
          example: "13400000000"

        clientOrderId:
          type: string
          nullable: true
          description: |
            شناسه اختیاری سفارش که توسط کاربر برای پیگیری و مدیریت سفارش ایجاد می‌شود.
            این مقدار باید در میان سفارش‌های باز کاربر یکتا باشد.

            محدودیت‌ها:
            - حداکثر طول مقدار ۳۲ نویسه است.
            - فقط شامل حروف انگلیسی (A-Z و a-z)، اعداد (0-9) و خط تیره (-) مجاز است.
            - مقدار باید با الگوی زیر مطابقت داشته باشد:
              ^[A-Za-z0-9-]+$
          example: my-order-123

    MarginMarketOrderRequest:
      title: سفارش Market
      type: object

      required:
        - execution
        - srcCurrency
        - dstCurrency
        - amount

      properties:
        execution:
          type: string
          description: نوع سفارش. برای سفارش Market مقدار این فیلد باید برابر با market باشد.
          example: market

        srcCurrency:
          type: string
          description: |
            نماد رمزارز پایه بازار که سفارش بر روی آن ایجاد می‌شود.
            مثال: در بازار BTC/USDT مقدار این فیلد btc است.
          example: btc

        dstCurrency:
          type: string
          description: |
            ارز مقابل بازار که ارزش سفارش بر اساس آن محاسبه می‌شود.
            مثال: در بازار BTC/USDT مقدار این فیلد usdt است.
          example: usdt

        type:
          type: string
          description: |
            جهت سفارش:
            - buy: ایجاد موقعیت خرید
            - sell: ایجاد موقعیت فروش
          enum:
            - buy
            - sell
          example: sell

        leverage:
          type: string
          description: |
            ضریب اهرم مورد استفاده در معامله تعهدی.
            مقدار بالاتر باعث افزایش حجم موقعیت نسبت به سرمایه اولیه می‌شود.
          default: "1"
          example: "2"

        amount:
          type: string
          description: |
            مقدار دارایی موردنظر برای معامله.
            سفارش Market بدون تعیین قیمت و با بهترین قیمت موجود در بازار اجرا می‌شود.
          example: "0.01"

        clientOrderId:
          type: string
          nullable: true
          description: |
            شناسه اختیاری سفارش که توسط کاربر برای پیگیری و مدیریت سفارش ایجاد می‌شود.
            این مقدار باید در میان سفارش‌های باز کاربر یکتا باشد.

            محدودیت‌ها:
            - حداکثر طول مقدار ۳۲ نویسه است.
            - فقط حروف انگلیسی (A-Z و a-z)، اعداد (0-9) و خط تیره (-) مجاز است.
            - مقدار باید با الگوی زیر مطابقت داشته باشد:
              ^[A-Za-z0-9-]+$
          example: my-order-123

    MarginStopMarketOrderRequest:
      title: سفارش Stop Market
      type: object

      required:
        - execution
        - srcCurrency
        - dstCurrency
        - amount
        - stopPrice

      properties:
        execution:
          type: string
          description: نوع سفارش. برای سفارش Stop Market مقدار این فیلد باید برابر با stop_market باشد.
          enum:
            - stop_market
          example: stop_market

        srcCurrency:
          type: string
          description: |
            نماد رمزارز پایه بازار که سفارش بر روی آن ایجاد می‌شود.
            مثال: در بازار BTC/USDT مقدار این فیلد btc است.
          example: btc

        dstCurrency:
          type: string
          description: |
            ارز مقابل بازار که ارزش سفارش بر اساس آن محاسبه می‌شود.
            مثال: در بازار BTC/USDT مقدار این فیلد usdt است.
          example: usdt

        type:
          type: string
          description: |
            جهت سفارش:
            - buy: ایجاد موقعیت خرید
            - sell: ایجاد موقعیت فروش
          enum:
            - buy
            - sell
          example: sell

        leverage:
          type: string
          description: |
            ضریب اهرم مورد استفاده در معامله تعهدی.
            مقدار بالاتر باعث افزایش حجم موقعیت نسبت به سرمایه اولیه می‌شود.
          default: "1"
          example: "2"

        amount:
          type: string
          description: |
            مقدار دارایی موردنظر برای معامله.
            پس از رسیدن قیمت بازار به قیمت توقف، سفارش با بهترین قیمت موجود در بازار اجرا می‌شود.
          example: "0.01"

        stopPrice:
          type: string
          description: |
            قیمت فعال‌سازی سفارش Stop Market.
            زمانی که قیمت بازار به این مقدار برسد، سفارش فعال شده و به‌صورت Market اجرا می‌شود.
          example: "12600000000"

        clientOrderId:
          type: string
          nullable: true
          description: |
            شناسه اختیاری سفارش که توسط کاربر برای پیگیری و مدیریت سفارش ایجاد می‌شود.
            این مقدار باید در میان سفارش‌های باز کاربر یکتا باشد.

            محدودیت‌ها:
            - حداکثر طول مقدار ۳۲ نویسه است.
            - فقط حروف انگلیسی (A-Z و a-z)، اعداد (0-9) و خط تیره (-) مجاز است.
            - مقدار باید با الگوی زیر مطابقت داشته باشد:
              ^[A-Za-z0-9-]+$
            example: my-order-123

    MarginStopLimitOrderRequest:
      title: سفارش Stop Limit
      type: object

      required:
