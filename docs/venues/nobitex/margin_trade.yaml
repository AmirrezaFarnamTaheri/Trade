    MarginOrder:
      type: object
      description: |
        فیلدهای `param1` و `pairId` شرطی هستند.
        فیلدهای `leverage` و `side` فقط برای سفارش‌های تعهدی برگردانده می‌شوند.

      properties:
        type:
          type: string
          description: نوع سفارش.
          enum:
            - buy
            - sell
          example: sell

        execution:
          type: string
          description: نوع اجرای سفارش.
          enum:
            - Limit
            - Market
            - StopLimit
            - StopMarket
          example: Limit

        tradeType:
          type: string
          description: نوع معامله.
          enum:
            - Spot
            - Margin
            - Credit
            - Debit
          example: Margin

        srcCurrency:
          type: string
          description: |
            عنوان نمایشی رمزارز مبدأ.
          example: btc

        dstCurrency:
          type: string
          description: |
            عنوان نمایشی رمزارز مقصد.
          example: rls

        price:
          description: |
            قیمت سفارش.

            برای سفارش‌های بازار مقدار این فیلد برابر `market` است.
            در سایر سفارش‌ها مقدار قیمت سفارش برگردانده می‌شود.
          type: string
          example: "6400000000"

        amount:
          description: مقدار سفارش.
          type: string
          example: "0.01"

        totalPrice:
          description: مجموع قیمت بخش انجام‌شده سفارش.
          type: string
          example: "0"

        totalOrderPrice:
          description: قیمت کل سفارش.
          type: string
          example: "64000000"

        matchedAmount:
          description: مقدار انجام‌شده سفارش.
          type: string
          example: "0"

        unmatchedAmount:
          description: مقدار انجام‌نشده سفارش.
          type: string
          example: "0.01"

        clientOrderId:
          type: string
          nullable: true
          description: شناسه سفارش تعیین‌شده توسط کاربر.
          example: null

        param1:
          description: |
            پارامتر تکمیلی سفارش.

            این فیلد فقط زمانی برگردانده می‌شود که مقدار `order.param1`
            برابر `null` نباشد. در سفارش‌های حد ضرر معمولاً شامل قیمت
            توقف است.
          type: string
          example: "6450000000"

        pairId:
          type: integer
          nullable: true
          description: |
            شناسه زوج بازار.

            این فیلد فقط زمانی برگردانده می‌شود که سفارش دارای `pair_id`
            باشد.
          example: 12

        leverage:
          description: |
            ضریب وکالت سفارش.

            این فیلد فقط برای سفارش‌هایی که `is_margin` هستند برگردانده
            می‌شود.
          type: string
          example: "2"

        side:
          type: string
          description: |
            وضعیت باز یا بسته‌کردن موقعیت.

            اگر `order.side` با `order.order_type` برابر باشد، مقدار `open`
            و در غیر این صورت مقدار `close` برگردانده می‌شود.

            این فیلد فقط برای سفارش‌های تعهدی برگردانده می‌شود.
          enum:
            - open
            - close
          example: open

        id:
          type: integer
          description: شناسه سفارش.
          example: 25

        status:
          type: string
          description: وضعیت سفارش.
          enum:
            - New
            - Active
            - Done
            - Canceled
            - Inactive
          example: Active

        partial:
          type: boolean
          description: مشخص می‌کند سفارش به‌صورت جزئی انجام شده است یا خیر.
          example: false

        fee:
          description: کارمزد سفارش.
          type: string
          example: "0"

        created_at:
          type: string
          format: date-time
          description: زمان ایجاد سفارش.
          example: "2022-10-20T11:36:13.592827+00:00"

        averagePrice:
          description: میانگین قیمت معاملات انجام‌شده سفارش.
          type: string
          example: "0"


    MarginOrderResponseSingle:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
          example: ok
        order:
          $ref: "#/components/schemas/MarginOrder"

    MarginOrderResponseOCO:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
          example: ok
        orders:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/MarginOrder"

    PositionListResponse:
          type: object
          properties:
            status:
              type: string
              description: وضعیت کلی پاسخ.
              enum:
                - ok
              example: ok

            positions:
              type: array
              description: لیست موقعیت‌های مطابق فیلترهای درخواست.
              items:
                $ref: "#/components/schemas/Position"

            hasNext:
              type: boolean
              description: |
                مشخص می‌کند پس از صفحه فعلی، صفحه دیگری از نتایج وجود دارد یا خیر.
              example: false

    Position:
      type: object
      description: |
        اطلاعات یک موقعیت تعهدی.

        برخی فیلدها فقط برای موقعیت‌های فعال و برخی دیگر فقط برای
        موقعیت‌های پایان‌یافته برگردانده می‌شوند.

        مقادیر مالی و اعشاری به‌صورت رشته برگردانده می‌شوند تا دقت
        اعداد اعشاری حفظ شود.

      properties:
        id:
          type: integer
          description: شناسه یکتای موقعیت.
          example: 128

        createdAt:
          type: string
          format: date-time
          description: |
            زمان ایجاد موقعیت یا زمان ثبت سفارش اولیه معاملات تعهدی.
          example: "2022-10-20T11:36:13.604420+00:00"

        srcCurrency:
          type: string
          description: رمزارز مبدأ بازار.
          example: btc

        dstCurrency:
          type: string
          description: ارز مقصد بازار.
          example: rls

        side:
          type: string
          description: جهت موقعیت.
          enum:
            - buy
            - sell
          example: sell

        status:
          type: string
          description: |
            وضعیت فعلی موقعیت.

            - `Open`: همه یا بخشی از سفارش تعهدی در بازار انجام شده و موقعیت باز است.
            - `Closed`: مقدار وکالت گرفته‌شده بازپرداخت و موقعیت تسویه شده است.
            - `Liquidated`: موقعیت به دلیل عبور از حد مجاز ریسک لیکویید شده است.
            - `Expired`: مهلت موقعیت پایان یافته است.

            ممکن است موقعیت‌های `Liquidated` یا `Expired` تا پایان فرایند
            تسویه سیستمی، موقتاً در پاسخ موقعیت‌های فعال برگردانده شوند.
          enum:
            - Open
            - Closed
            - Liquidated
            - Expired
          example: Open

        marginType:
          type: string
          description: |
            نوع تضمین موقعیت.

            - `Isolated Margin`: زیان حداکثر به اندازه وجه تضمین همان موقعیت است.
            - `Cross Margin`: زیان می‌تواند از کل موجودی آزاد کیف‌پول تعهدی تأمین شود.

            در حال حاضر نوع پیش‌فرض و قابل استفاده `Isolated Margin` است.
          enum:
            - Isolated Margin
            - Cross Margin
          example: Isolated Margin

        collateral:
          type: string
          description: |
            وجه تضمین بلوکه‌شده در کیف‌پول تعهدی، بر حسب ارز مقصد.
          example: "640000000"

        leverage:
          type: string
          description: ضریب وکالت موقعیت.
          example: "2"

        openedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            زمان بازشدن موقعیت؛ یعنی زمانی که همه یا بخشی از سفارش اولیه
            در بازار انجام شده است.
          example: "2022-10-20T11:36:16.562038+00:00"

        closedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            زمان تسویه نهایی موقعیت.

            این مقدار برای موقعیت‌های فعال معمولاً `null` است.
          example: "2022-10-25T09:57:38.560820+00:00"

        liquidationPrice:
          type: string
          nullable: true
          description: |
            قیمت تقریبی لیکوییدشدن موقعیت، بر حسب ارز مقصد بازار.
          example: "25174302690"

        entryPrice:
          type: string
          nullable: true
          description: |
            میانگین قیمت سفارش‌هایی که باعث بازشدن موقعیت شده‌اند.
          example: "6400000000"

        exitPrice:
          type: string
          nullable: true
          description: |
            میانگین قیمت سفارش‌های تسویه موقعیت.

            این فیلد برای موقعیت‌های فعال معمولاً `null` است.
          example: "6200000000"

        delegatedAmount:
          type: string
          nullable: true
          description: |
            مقدار وکالت گرفته‌شده در لحظه، بر حسب رمزارز مبدأ.

            این فیلد ویژه موقعیت‌های فعال است.
          example: "0.03"

        liability:
          type: string
          nullable: true
          description: |
            مقدار تعهد فعلی موقعیت.

            در موقعیت فروش، تعهد خرید شامل مقدار وکالت گرفته‌شده به‌علاوه
            کارمزد سفارش خرید است. در موقعیت خرید، کارمزد سفارش خرید از
            مقدار تعهد کسر می‌شود.

            این فیلد ویژه موقعیت‌های فعال است.
          example: "0.0300450676"

        totalAsset:
          type: string
          nullable: true
          description: |
            دارایی کلی موقعیت، بر حسب ارز مقصد.

            در موقعیت فروش، شامل وجه تضمین و باقی‌مانده وجه حاصل از فروش است.
            در موقعیت خرید، برابر ارزش لحظه‌ای دارایی خریداری‌شده است.

            این فیلد ویژه موقعیت‌های فعال است.
          example: "831712000"

        marginRatio:
          type: string
          nullable: true
          description: |
            نسبت تعهد موقعیت.

            نسبت اولیه معمولاً `2` است و حداقل نسبت لازم برای جلوگیری از
            لیکوییدشدن `1.1` است.

            این فیلد ویژه موقعیت‌های فعال است.
          example: "1.49"

        liabilityInOrder:
          type: string
          nullable: true
          description: |
            بخشی از تعهد که در سفارش‌های باز تسویه قرار دارد.

            این فیلد ویژه موقعیت‌های فعال است.
          example: "0"

        assetInOrder:
          type: string
          nullable: true
          description: |
            بخشی از دارایی کلی که در سفارش‌های باز تسویه قرار دارد.

            این فیلد ویژه موقعیت‌های فعال است.
          example: "0"

        unrealizedPNL:
          type: string
          nullable: true
          description: |
            سود یا زیان محقق‌نشده و لحظه‌ای موقعیت، بر حسب ارز مقصد.

            مقدار منفی نشان‌دهنده زیان و مقدار مثبت نشان‌دهنده سود است.

            این فیلد ویژه موقعیت‌های فعال است.
          example: "-576435"

        unrealizedPNLPercent:
          type: string
          nullable: true
          description: |
            درصد سود یا زیان محقق‌نشده و لحظه‌ای موقعیت.

            این فیلد ویژه موقعیت‌های فعال است.
          example: "-0.09"

        expirationDate:
          type: string
          format: date
          nullable: true
          description: |
            تاریخ انقضای نهایی موقعیت.

            هر موقعیت از زمان ثبت سفارش اولیه حداکثر ۳۰ روز می‌تواند باز بماند.

            این فیلد ویژه موقعیت‌های فعال است.
          example: "2022-11-20"

        extensionFee:
          type: string
          nullable: true
          description: |
            مقدار کارمزد تمدید موقعیت در پایان روز، بر حسب ارز مقصد.

            این فیلد ویژه موقعیت‌های فعال است.
          example: "320000"

        markPrice:
          type: string
          nullable: true
          description: |
            قیمت معیار بازار در لحظه محاسبه اطلاعات موقعیت.

            این فیلد ویژه موقعیت‌های فعال است.
          example: "6430000000"

        PNL:
          type: string
          nullable: true
          description: |
            سود یا زیان نهایی موقعیت، بر حسب ارز مقصد.

            مقدار منفی نشان‌دهنده زیان و مقدار مثبت نشان‌دهنده سود است.

            این فیلد ویژه موقعیت‌های پایان‌یافته است.
          example: "35584000"

        PNLPercent:
          type: string
          nullable: true
          description: |
            درصد سود یا زیان نهایی موقعیت.

            این فیلد ویژه موقعیت‌های پایان‌یافته است.
          example: "5.56"


    PositionCollateralEditRequest:
      type: object
      additionalProperties: false
      required:
        - collateral
      properties:
        collateral:
          type: string
          description: |
            مقدار جدید وجه تضمین موقعیت.

            مقدار باید به‌صورت رشته‌ای از عدد ارسال شود و بیانگر کل وجه
            تضمین جدید موقعیت است، نه مقدار افزایش یا کاهش آن.
          pattern: "^[0-9]+(?:\\.[0-9]+)?$"
          example: "230000000"


    MarginFailedResponse:
      type: object
      properties:
        status:
          type: string
          enum: [failed]
          example: failed
        code:
          type: string
        message:
          type: string

    Wallet:
      type: object
      properties:
        id:
          type: integer
          example: 1234

        currency:
          type: string
          description: نماد ارز مربوط به کیف پول
          example: usdt

        balance:
          type: string
          description: موجودی کل کیف پول شامل موجودی قابل‌استفاده و موجودی بلوکه‌شده
          example: "101.6722709097"

        blockedBalance:
          type: string
          description: مقدار موجودی بلوکه 
          example: "0"

        activeBalance:
          type: string
          description: مقدار موجودی فعال و قابل‌استفاده کیف پول
          example: "101.6722709097"

        rialBalance:
          type: integer
          format: int64
          description: ارزش ریالی موجودی کیف پول بر اساس نرخ محاسبه‌شده فعلی
          example: 296058089

        rialBalanceSell:
          type: integer
          format: int64
          description: ارزش ریالی موجودی کیف پول بر اساس نرخ فروش ارز
          example: 2964682847

        type:
          type: string
          description: نوع کیف پول و کاربرد آن در سامانه
          enum:
            - spot
            - margin
          example: spot
