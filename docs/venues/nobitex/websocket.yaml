openapi: 3.0.3
info:
  title: API وب‌سوکت نوبیتکس
  version: "1.0.0"
  description: |
    مستندات اتصال وب‌سوکت نوبیتکس، دریافت توکن اتصال و کانال‌های عمومی و خصوصی.

    وب‌سوکت نوبیتکس بر پایه پروتکل Centrifugo است و برای دریافت داده‌های لحظه‌ای بازار و رویدادهای خصوصی کاربر استفاده می‌شود.

    - آدرس وب‌سوکت اصلی: `wss://ws.nobitex.ir/connection/websocket`
    - آدرس وب‌سوکت تست‌نت: `wss://testnetws.nobitex.ir/connection/websocket`
    - کانال‌های عمومی با پیشوند `public:` بدون توکن قابل استفاده هستند.
    - کانال‌های خصوصی با پیشوند `private:` به توکن اتصال و `websocketAuthParam` کاربر نیاز دارند.
    - حداکثر اتصال هم‌زمان برای هر کاربر احراز هویت‌شده روی هر نود: ۱۰۰ اتصال
    - حداکثر تعداد کانال برای هر کلاینت متصل: ۴۵۰ کانال

servers:
  - url: https://apiv2.nobitex.ir
    description: API اصلی برای دریافت توکن اتصال
  - url: https://testnetapiv2.nobitex.ir
    description: API تست‌نت برای دریافت توکن اتصال

tags:
  - name: وب‌سوکت
    description: |
      نوبیتکس برای ارائه داده‌های لحظه‌ای بازار و رویدادهای خصوصی کاربر از وب‌سوکت مبتنی بر Centrifugo استفاده می‌کند.

      مسیر کلی استفاده:

      1. برای کانال‌های عمومی، به وب‌سوکت وصل شوید و در کانال عمومی مورد نظر عضو شوید. توکن لازم نیست.
      2. برای کانال‌های خصوصی، ابتدا از API دریافت توکن اتصال، توکن بگیرید و مقدار `websocketAuthParam` را از پروفایل کاربر بخوانید.
      3. با توکن اتصال به وب‌سوکت وصل شوید و در کانال خصوصی با الگوی `private:{channelName}#{websocketAuthParam}` عضو شوید.

      نکته‌ها:

      - توکن اتصال وب‌سوکت ۱۲۰۰ ثانیه اعتبار دارد و فقط برای اتصال احراز هویت‌شده استفاده می‌شود.
      - مقدار `websocketAuthParam` برای نام کانال خصوصی استفاده می‌شود، برای هر کاربر ثابت است و توکن اتصال نیست.
      - برای دریافت پیام‌ها، بعد از اتصال باید در یک یا چند کانال عضو شوید.

      SDKهای رسمی پیشنهادی Centrifugo:

      | SDK | کاربرد |
      | --- | --- |
      | [centrifuge-js](https://github.com/centrifugal/centrifuge-js) | مرورگر، Node.js و React Native |
      | [centrifuge-python](https://github.com/centrifugal/centrifuge-python) | پایتون و asyncio |
      | [centrifuge-java](https://github.com/centrifugal/centrifuge-java) | جاوا و Android |
      | [centrifuge-go](https://github.com/centrifugal/centrifuge-go) | Go |
      | [centrifuge-swift](https://github.com/centrifugal/centrifuge-swift) | iOS و Swift |
      | [centrifuge-dart](https://github.com/centrifugal/centrifuge-dart) | Dart و Flutter |

      SDK غیررسمی قابل استفاده:

      - [centrifuge-csharp](https://github.com/charmy/centrifuge-csharp) برای C#، .NET و Unity

paths:
  /connection/websocket:
    get:
      tags:
        - وب‌سوکت
      summary: اتصال و عضویت
      description: |
        این مسیر نقطه اتصال اصلی وب‌سوکت است. بعد از اتصال باید در کانال‌های مورد نیاز عضو شوید تا پیام‌های لحظه‌ای دریافت کنید.

        آدرس‌های اتصال:

        - اصلی: `wss://ws.nobitex.ir/connection/websocket`
        - تست‌نت: `wss://testnetws.nobitex.ir/connection/websocket`

        کاربرد این صفحه:

        - اتصال به وب‌سوکت
        - عضویت در کانال‌های عمومی
        - مدیریت ping/pong و محدودیت‌های اتصال

        برای کانال‌های خصوصی، ابتدا از `/auth/ws/token/` توکن اتصال بگیرید و سپس با توکن وصل شوید. جزئیات در صفحه «توکن اتصال خصوصی» آمده است.

        محدودیت‌ها و رفتار اتصال:

        - کانال‌های عمومی بدون توکن قابل استفاده هستند.
        - حداکثر اتصال هم‌زمان برای هر کاربر احراز هویت‌شده روی هر نود: ۱۰۰ اتصال
        - حداکثر تعداد کانال برای هر کلاینت متصل: ۴۵۰ کانال
        - سرور پیام ping خالی `{}` می‌فرستد و کلاینتی که بدون SDK متصل شده است باید ظرف ۲۰ ثانیه pong خالی `{}` برگرداند.
        - SDKهای رسمی Centrifugo فرایند ping/pong را خودکار مدیریت می‌کنند.
        - در SDKهای رسمی می‌توانید هنگام عضویت گزینه `{ delta: 'fossil' }` را فعال کنید. این گزینه باعث کاهش حجم انتقال می‌شود و SDK رسمی داده را به شکل عادی به تابع بازگشتی تحویل می‌دهد.
        - اگر بدون SDK یا با کتابخانه غیررسمی متصل می‌شوید، گزینه delta را فعال نکنید مگر اینکه بازیابی داده با الگوریتم Fossil را پیاده‌سازی کرده باشید.

        نصب SDK جاوااسکریپت:

        ```bash
        npm install centrifuge
        ```

        اتصال عمومی با SDK:

        ```javascript
        import { Centrifuge } from 'centrifuge';

        const client = new Centrifuge('wss://ws.nobitex.ir/connection/websocket', {});

        client.on('connected', (ctx) => {
          console.log('connected', ctx);
        });

        client.connect();
        ```

        عضویت در کانال عمومی با SDK:

        ```javascript
        const sub = client.newSubscription('public:trades-BTCIRT', { delta: 'fossil' });

        sub.on('publication', (ctx) => {
          console.log(ctx.data);
        });

        sub.subscribe();
        ```

        استفاده مستقیم در HTML:

        ```html
        <script src="https://unpkg.com/centrifuge@5/dist/centrifuge.js"></script>
        ```

        اتصال مستقیم بدون SDK:

        ```json
        {
          "connect": {},
          "id": 1
        }
        ```

        عضویت در چند کانال با یک اتصال:

        ```javascript
        const channels = ['public:orderbook-BTCIRT', 'public:trades-BTCIRT'];

        channels.forEach((channel) => {
          const sub = client.newSubscription(channel, { delta: 'fossil' });
          sub.on('publication', (ctx) => {
            console.log(channel, ctx.data);
          });
          sub.subscribe();
        });
        ```
      operationId: websocketConnection
      servers:
        - url: wss://ws.nobitex.ir
          description: وب‌سوکت اصلی
        - url: wss://testnetws.nobitex.ir
          description: وب‌سوکت تست‌نت
      x-websocket: true
      responses:
        "101":
          description: اتصال وب‌سوکت برقرار شد
        "400":
          description: درخواست ارتقای وب‌سوکت نامعتبر است
        "429":
          description: محدودیت اتصال یا تعداد کانال رعایت نشده است

  /auth/ws/token/:
    parameters:
      - $ref: "#/components/parameters/TraderBotUserAgent"
    get:
      tags:
        - وب‌سوکت
      summary: توکن اتصال خصوصی
      description: |
        این API یک توکن JWT برای اتصال احراز هویت‌شده به وب‌سوکت تولید می‌کند. این توکن فقط برای کانال‌های خصوصی لازم است؛ کانال‌های عمومی به توکن نیاز ندارند.

        <div class="alert alert--secondary">
          #### API Key
          در صورت استفاده از API Key، دسترسی `READ` روی کلید الزامی است.
        </div>
        <br/>

        تفاوت دو مقدار احراز هویت:

        | مقدار | از کجا می‌آید؟ | کاربرد |
        | --- | --- | --- |
        | `token` | پاسخ همین API | احراز هویت اتصال وب‌سوکت |
        | `websocketAuthParam` | پاسخ پروفایل کاربر | ساخت نام کانال خصوصی |

        مراحل استفاده از کانال خصوصی:

        1. مقدار `websocketAuthParam` را از پاسخ پروفایل کاربر بخوانید.
        2. از این API توکن اتصال بگیرید.
        3. با مقدار `token` به وب‌سوکت وصل شوید.
        4. در کانال خصوصی مورد نظر با الگوی `private:{channelName}#{websocketAuthParam}` عضو شوید.

        نکته‌ها:

        - مدت اعتبار توکن اتصال: ۱۲۰۰ ثانیه
        - در کلاینت‌های Centrifugo مقدار `token` برگشتی را به گزینه اتصال یا تابع `getToken` بدهید.
        - در اتصال مستقیم بدون SDK، پیام اتصال خصوصی به شکل `{"connect":{"token":"<CONNECTION_TOKEN>"},"id":1}` ارسال می‌شود.
        - مقدار `websocketAuthParam` توکن نیست و نیازی به تمدید ندارد.

        نمونه درخواست:

        ```bash
        curl 'https://apiv2.nobitex.ir/auth/ws/token/' \
          -H 'Authorization: Token <USER_TOKEN>'
        ```

        اتصال با توکن ثابت:

        ```javascript
        import { Centrifuge } from 'centrifuge';

        const client = new Centrifuge('wss://ws.nobitex.ir/connection/websocket', {
          token: '<CONNECTION_TOKEN>',
        });

        client.connect();
        ```

        دریافت و تمدید خودکار توکن با SDK:

        ```javascript
        import { Centrifuge, UnauthorizedError } from 'centrifuge';

        async function getToken() {
          const response = await fetch('https://apiv2.nobitex.ir/auth/ws/token/', {
            headers: {
              Authorization: 'Token <USER_TOKEN>',
            },
          });

          if (!response.ok) {
            if (response.status === 401 || response.status === 403) {
              throw new UnauthorizedError('WebSocket authentication failed');
            }
            throw new Error(`Unexpected status code ${response.status}`);
          }

          const data = await response.json();
          return data.token;
        }

        const client = new Centrifuge('wss://ws.nobitex.ir/connection/websocket', {
          getToken,
        });

        client.connect();
        ```

        اتصال مستقیم بدون SDK با توکن:

        ```json
        {
          "connect": {
            "token": "<CONNECTION_TOKEN>"
          },
          "id": 1
        }
        ```
      operationId: getWebsocketToken
      security:
        - TokenAuth: []
        - KeyAuth: []
          SignatureAuth: []
          TimestampAuth: []
      responses:
        "200":
          description: موفق
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsocketTokenResponse"
              example:
                status: ok
                token: "eyJhbGciOiJFUzUxMiIsInR5cCI6IkpXVCJ9.example"
        "401":
          description: احراز هویت نامعتبر است
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: دسترسی لازم برای دریافت توکن وجود ندارد
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: محدودیت فراخوانی یا اتصال رد شده است
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /channels/orderbook:
    get:
      tags:
        - وب‌سوکت
      summary: "کانال لیست سفارش‌ها: اردربوک"
      description: |
        کانال اردربوک با هر تغییر در اردربوک بازار پیام منتشر می‌کند.

        الگوی کانال:

        - `public:orderbook-{MARKET_SYMBOL}`

        مقدار `MARKET_SYMBOL` باید با حروف بزرگ ارسال شود؛ مثل `BTCIRT` یا `ETHUSDT`.

        نکته مهم: این کانال‌ها تنها در صورت وقوع تغییر در اردربوک پیام ارسال می‌کنند. بنابراین، در بازارهایی با حجم معاملات کم، ممکن است مدت زمان زیادی بین پیام‌ها فاصله باشد. به‌منظور رفع این مشکل توصیه می‌شود قبل از اشتراک در کانال‌های وب‌سوکت، یک بار اطلاعات اولیه اردربوک را از طریق API اردربوک ورژن ۳ دریافت کنید.

        عضویت با SDK:

        ```javascript
        const sub = client.newSubscription('public:orderbook-BTCIRT', { delta: 'fossil' });

        sub.on('subscribed', () => {
          console.log('subscribed');
        });

        sub.on('publication', (ctx) => {
          console.log(ctx.data);
        });

        sub.subscribe();
        ```

        عضویت مستقیم بدون SDK:

        ```json
        {
          "id": 2,
          "subscribe": {
            "channel": "public:orderbook-BTCIRT"
          }
        }
        ```

        نمونه پیام در SDK:

        ```json
        {
          "asks": [
            ["35077909990", "0.009433"],
            ["35078000000", "0.000274"]
          ],
          "bids": [
            ["35020080080", "0.185784"],
            ["35020070060", "0.086916"]
          ],
          "lastTradePrice": "35077909990",
          "lastUpdate": 1726581829816
        }
        ```

        نمونه پیام در اتصال مستقیم بدون SDK:

        ```json
        {
          "push": {
            "channel": "public:orderbook-BTCIRT",
            "pub": {
              "data": "{\"asks\":[[\"35077909990\",\"0.009433\"]],\"bids\":[[\"35020080080\",\"0.185784\"]],\"lastTradePrice\":\"35077909990\",\"lastUpdate\":1726581829816}",
              "offset": 989153
            }
          }
        }
        ```
      operationId: websocketOrderbookChannel
      x-websocket: true
      x-websocket-channel: public:orderbook-{MARKET_SYMBOL}
      responses:
        "200":
          description: پیام کانال اردربوک
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderbookUpdate"

  /channels/candle:
    get:
      tags:
        - وب‌سوکت
      summary: کانال آمار OHLC بازار نوبیتکس
      description: |
        کانال کندل، داده OHLC بازار را به صورت دوره‌ای و تقریبا هر ۱۰ ثانیه منتشر می‌کند.

        الگوی کانال:

        - `public:candle-{MARKET_SYMBOL}-{RESOLUTION}`

        مقدار `MARKET_SYMBOL` باید با حروف بزرگ ارسال شود؛ مثل `BTCIRT` یا `ETHUSDT`.

        رزولوشن‌های قابل استفاده:

        | دسته | مقدارها |
        | --- | --- |
        | دقیقه | `1`، `5`، `15`، `30` |
        | ساعت | `60`، `180`، `240`، `360`، `720` |
        | روز | `D`، `1D`، `2D`، `3D` |

        کندل‌های ۱، ۵، ۱۵ و ۳۰ دقیقه‌ای برای ۷ روز اخیر در دسترس هستند.

        عضویت با SDK:

        ```javascript
        const sub = client.newSubscription('public:candle-BTCIRT-15', { delta: 'fossil' });

        sub.on('publication', (ctx) => {
          console.log(ctx.data);
        });

        sub.subscribe();
        ```

        عضویت مستقیم بدون SDK:

        ```json
        {
          "id": 2,
          "subscribe": {
            "channel": "public:candle-BTCIRT-15"
          }
        }
        ```

        نمونه پیام:

        ```json
        {
          "t": 1731852900,
          "o": 6240000001.0,
          "h": 6250000000.0,
          "l": 6238000000.0,
          "c": 6238031033.0,
          "v": 1.26
        }
        ```
      operationId: websocketCandleChannel
      x-websocket: true
      x-websocket-channel: public:candle-{MARKET_SYMBOL}-{RESOLUTION}
      responses:
        "200":
          description: پیام کانال OHLC
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandleOhlc"

  /channels/public-trades:
    get:
      tags:
        - وب‌سوکت
      summary: کانال عمومی معاملات
      description: |
        در این کانال، معاملات انجام‌شده در یک بازار منتشر می‌شود.

        الگوی کانال:

        - `public:trades-{MARKET_SYMBOL}`

        مقدار `MARKET_SYMBOL` باید با حروف بزرگ ارسال شود؛ مثل `BTCIRT` یا `ETHUSDT`.

        عضویت با SDK:

        ```javascript
        const sub = client.newSubscription('public:trades-BTCIRT', { delta: 'fossil' });

        sub.on('publication', (ctx) => {
          console.log(ctx.data);
        });

        sub.subscribe();
        ```

        نمونه پیام:

        ```json
        {
          "price": "120000000000",
          "time": 1762781164192,
          "type": "sell",
          "volume": "0.000003"
        }
        ```
      operationId: websocketPublicTradesChannel
      x-websocket: true
      x-websocket-channel: public:trades-{MARKET_SYMBOL}
      responses:
        "200":
          description: پیام کانال معاملات عمومی
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicTrade"

  /channels/market-stats:
    get:
      tags:
        - وب‌سوکت
      summary: کانال وضعیت بازارها
      description: |
        این کانال‌ها آمار ۲۴ ساعته بازارها را منتشر می‌کنند.

        الگوی کانال آمار یک بازار:

        - `public:market-stats-{MARKET_SYMBOL}`

        کانال آمار همه بازارها:

        - `public:market-stats-all`

        مقدار `MARKET_SYMBOL` باید با حروف بزرگ ارسال شود؛ مثل `BTCIRT` یا `ETHUSDT`.

        نمونه پیام آمار یک بازار:

        ```json
