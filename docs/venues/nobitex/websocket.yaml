        نمونه پیام آمار همه بازارها:

        ```json
        {
          "btc-rls": {
            "isClosed": false,
            "bestSell": "121073861950",
            "bestBuy": "120000000000",
            "volumeSrc": "0.000185131782",
            "volumeDst": "21590044.0170869949",
            "latest": "114879999920",
