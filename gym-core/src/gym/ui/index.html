<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TradingGYM</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header>
  <h1 data-t="title"></h1>
  <span class="demo" id="demo" hidden>DEMO</span>
  <span class="flag" id="fx" hidden></span>
  <nav class="row" role="tablist">
    <button data-view="markets" data-t="markets" aria-current="page"></button>
    <button data-view="operate" data-t="operate"></button>
    <button data-view="rules" data-t="rules"></button>
    <button data-view="health" data-t="health"></button>
    <button data-view="journal" data-t="journal"></button>
  </nav>
  <span class="spacer"></span>
  <span class="clock" id="clock" aria-live="off"></span>
  <button class="btn" id="lang" aria-label="Language">فارسی</button>
</header>
<main>
  <section id="v-operate" hidden>
    <h2 data-t="operate"></h2>
    <p class="mut" data-t="operateWarning"></p>
    <h3 data-t="protectionHeading"></h3>
    <pre id="protection-state" role="status" aria-live="polite"></pre>
    <h3 data-t="offlineTicketTitle"></h3>
    <label for="offline-ticket" data-t="offlineTicketHelp"></label>
    <textarea id="offline-ticket" spellcheck="false" rows="8"></textarea>
    <div class="row">
      <button class="btn" id="preview-ticket" data-t="previewOffline"></button>
    </div>
    <pre id="ticket-output" role="status" aria-live="polite"></pre>
  </section>
  <section id="v-markets">
    <table aria-describedby="mk-note">
      <thead><tr><th data-t="pair"></th><th data-t="bid"></th><th data-t="ask"></th><th data-t="spread"></th>
        <th data-t="last"></th><th data-t="quality"></th><th data-t="when"></th></tr></thead>
      <tbody id="mk"></tbody>
    </table>
    <p class="mut" id="mk-note" data-t="mknote"></p>
  </section>

  <section id="v-rules" hidden>
    <h2 data-t="rulesTitle"></h2>
    <div class="row">
      <button class="btn" id="preset" data-t="preset"></button>
      <a class="btn" href="/api/rules/export" download data-t="export"></a>
      <span class="mut" id="rv"></span>
    </div>
    <table><thead><tr><th data-t="rule"></th><th data-t="cls"></th><th data-t="state"></th><th data-t="blocksNow"></th><th data-t="window"></th><th></th></tr></thead>
      <tbody id="rl"></tbody></table>
    <h2 style="margin-top:20px" data-t="importTitle"></h2>
    <label for="imp" class="mut" data-t="importHelp"></label>
    <textarea id="imp" spellcheck="false"></textarea>
    <div class="row"><button class="btn" id="doimp" data-t="import"></button><span id="impres" class="mut" role="status"></span></div>
  </section>

  <section id="v-journal" hidden>
    <h2 data-t="journal"></h2>
    <h3 data-t="accountRead"></h3>
    <p id="account-state" role="status"></p>
    <pre id="account-observations" aria-live="polite"></pre>
    <h3 data-t="externalHistory"></h3>
    <pre id="external-order-events" aria-live="polite"></pre>
    <label for="run-select" data-t="chooseRun"></label> <select id="run-select"></select>
    <p id="run-summary" role="status"></p>
    <svg id="equity" viewBox="0 0 800 180" role="img" aria-label="Paper equity in quote currency" style="width:100%;max-height:200px"></svg>
    <pre id="waterfall"></pre>
    <h3 data-t="evidenceTitle"></h3><pre id="economic"></pre>
    <h3 data-t="lastDecisions"></h3><div id="decisions"></div>
  </section>
  <section id="v-health" hidden>
    <h2 data-t="health"></h2>
    <pre id="hl"></pre>
    <h3 data-t="venueFactsTitle"></h3>
    <pre id="venue-facts" aria-live="polite"></pre>
  </section>
</main>
<script id="gym-config" type="application/json">{"token":"__GYM_TOKEN__","demo":__GYM_DEMO__}</script>
<script src="/app.js" defer></script>
</body>
</html>
