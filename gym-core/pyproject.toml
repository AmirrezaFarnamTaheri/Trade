[project]
name = "gym-core"
version = "0.2.0"
description = "TradingGYM public market collection and local paper-research workspace"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9", "cryptography>=44", "zstandard>=0.22", "tzdata"]

[project.optional-dependencies]
kernel = ["exec-kernel==0.2.0"]

[tool.uv.sources]
exec-kernel = { path = "../executor/exec-kernel-py" }

[project.scripts]
gymctl = "gym.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff==0.16.9"]

[tool.uv.build-backend]
module-name = "gym"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[tool.ruff.lint]
# TRY004: the API maps ValueError to HTTP 400; a TypeError for bad input would surface as a 500.
# PLW1510: tests assert on the exit code of each subprocess they start.
ignore = ["TRY004", "PLW1510"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF012", "SIM117"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["gym.domain.model.QualityLimits", "gym.domain.sim.CostModel"]
