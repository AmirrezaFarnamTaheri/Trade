[project]
name = "gym-core"
version = "0.2.0"
description = "TradingGYM public market collection and local paper-research workspace"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9", "cryptography>=44", "zstandard>=0.22", "tzdata"]

[project.optional-dependencies]
kernel = ["exec-kernel==0.2.0"]

[tool.uv.sources]
exec-kernel = { path = "../executor/exec-kernel-py" }

[project.scripts]
gymctl = "gym.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff==0.17.4"]

[tool.uv.build-backend]
module-name = "gym"

[build-system]
requires = ["uv_build>=0.11.23,<0.14.0"]
build-backend = "uv_build"

[tool.ruff.lint]
# Explicit, so a ruff upgrade cannot change what is checked. B905 (zip strict) is off: 40 call sites, none reviewed.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "DTZ", "PIE"]
ignore = ["B905", "E731"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF012", "SIM117"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["gym.domain.model.QualityLimits", "gym.domain.sim.CostModel"]
