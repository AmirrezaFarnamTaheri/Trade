[project]
name = "gym-core"
version = "0.1.0"
description = "TradingGYM gym-core daemon, Workstream A1: collector, venue rules, local API, Markets UI"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9", "cryptography>=44", "zstandard>=0.22", "tzdata"]

[project.scripts]
gymctl = "gym.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.build-backend]
module-name = "gym"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"
