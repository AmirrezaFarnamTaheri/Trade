name: Venue probe
# Manual only: answers whether a hosted runner can reach the venue, before any scheduled backfill is built on it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 gym-core/scripts/venue_probe.py
