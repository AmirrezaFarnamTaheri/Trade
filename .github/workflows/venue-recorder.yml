name: Venue recorder
# Keeps top-of-book quotes flowing when the local collector is off. Hosted runners reach the venue; Cloudflare's
# network is refused (403, probed 2026-11-14). Runs overlap on purpose: a scheduled start can be late, and the
# importer ignores duplicate rows. Fetch the files with `gh run download -n venue-quotes-<run id>`.
on:
  schedule:
    - cron: "7 */5 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes to record (1 to 350)
        default: "340"

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          MINUTES: ${{ inputs.minutes || '340' }}
        run: python3 gym-core/scripts/venue_recorder.py record --minutes "$MINUTES" --out quotes.jsonl
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: venue-quotes-${{ github.run_id }}
          path: quotes.jsonl
          retention-days: 90
          if-no-files-found: warn
