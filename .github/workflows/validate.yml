name: Validate
on:
  push:
    branches: [master, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Rust workspace
        run: cargo test --locked --workspace --all-targets
      - name: Check Windows bootstrap script syntax (no install)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('scripts/windows/Install-ReadOnlyExecutor.ps1', 'scripts/windows/Test-ReadOnlyExecutor.ps1', 'scripts/windows/Test-UnprivilegedExecutorAccess.ps1', 'scripts/windows/Test-ReadOnlyExecutorOnHostedVm.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) { throw "$file syntax error: $($errors | Out-String)" }
          }

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gym-core
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group dev
      - name: Upload resolved Python lock for reproducible dependency review
        uses: actions/upload-artifact@v4
        with:
          name: b3-resolved-uv-lock
          path: gym-core/uv.lock
          if-no-files-found: error
      - run: uv run pytest -q

  windows-vm-smoke:
    name: Disposable Windows SCM + access-control integration
    # Never install services while processing untrusted pull_request code.
    if: github.event_name == 'push' && github.repository == 'AmirrezaFarnamTaheri/Trade'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build read-only service using pinned dependencies
        run: cargo build --release --locked -p exec-svc --bin gym-executor
      - name: Verify service identity, DACL and two non-admin OS principals
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/windows/Test-ReadOnlyExecutorOnHostedVm.ps1 -BinaryPath ./target/release/gym-executor.exe

  update-python-lock:
    # Resolve lockfile changes only on trusted same-repository pushes.
    # Package metadata resolution runs before the write token is exposed.
    if: github.event_name == 'push' && github.repository == 'AmirrezaFarnamTaheri/Trade'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: gym-core
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Resolve and validate Python lock without write credentials
        run: uv lock
      - name: Commit lockfile only when resolution changed it
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gym-core/uv.lock
          if git diff --cached --quiet; then
            echo "uv.lock is already current"
            exit 0
          fi
          git commit -m "chore: refresh Python dependency lock"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF}"
