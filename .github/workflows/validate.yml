name: Validate
on:
  push:
    branches: [master, "feat/**"]
  pull_request:
  schedule:
    - cron: "17 2 * * 1"  # weekly: drills, chaos report, coverage and mutation checks catch drift without a push

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify clean Windows checkout and exact wire fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dirty = @(git status --porcelain=v1 --untracked-files=no)
          if ($dirty.Count -gt 0) { throw "Checkout changed tracked files: $($dirty -join ', ')" }
          foreach ($fixture in @('contracts/v1/fixtures/genesis-event.json', 'contracts/v1/fixtures/stop-wire-v1.json')) {
            $attribute = git check-attr text -- $fixture
            if ($attribute -notmatch ': text: unset$') { throw "Wire fixture not protected from line ending conversion: $fixture" }
          }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; version pinned below
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Test Rust workspace
        run: cargo test --locked --workspace --all-targets
      - name: Check Rust warnings
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Fake Venue chaos report (fails on any violated invariant)
        if: runner.os == 'Linux'
        run: |
          mkdir -p target/chaos
          cargo run --locked --release -p exec-svc --bin gym-chaos -- target/chaos/report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        with:
          name: chaos-report
          path: target/chaos/report.json
      - name: Check Windows bootstrap script syntax (no install)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in Get-ChildItem -LiteralPath scripts/windows -Filter *.ps1) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) { throw "$file syntax error: $($errors | Out-String)" }
          }
      - name: Verify OS-issued operator logon SID without installing service
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sid = & ./scripts/windows/Get-OperatorLogonSid.ps1
          if ($sid -notmatch '^S-1-5-5-[0-9]+-[0-9]+$') { throw 'Invalid TokenLogonSid result.' }
          Write-Output "PASS: Windows TokenLogonSid resolved for current process."

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gym-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.23"
      - run: uv lock --check
      - run: uv sync --locked --group dev
      - name: Check Python lint
        run: uvx ruff==0.17.4 check src tests
      - name: Complexity ceiling on the simulator money core
        run: uvx ruff==0.17.4 check --isolated --select C901 --config "lint.mccabe.max-complexity=20" src/gym/domain/sim.py
      - name: Complexity ratchet (no new function above 20; listed hotspots may only shrink)
        run: python scripts/complexity_ratchet.py
      - name: Tests with line coverage
        run: uv run --with coverage==7.6.10 coverage run --source=src/gym -m pytest -q
      - name: Coverage report
        run: |
          uv run --with coverage==7.6.10 coverage report --skip-covered --sort=cover | tail -40
          # Ratchet: floors sit just under the 2026-11-09 measurement (domain 94%, whole package 87%); raise, never lower.
          uv run --with coverage==7.6.10 coverage report --include="src/gym/domain/*" --fail-under=93 > /dev/null
          uv run --with coverage==7.6.10 coverage report --fail-under=86 > /dev/null
          uv run --with coverage==7.6.10 coverage html -d "$RUNNER_TEMP/coverage"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: ${{ runner.temp }}/coverage
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install axe-core for the accessibility pass
        run: npm install --no-save --prefix "$RUNNER_TEMP/axe" axe-core@4.10.2
      - name: Real-browser UI smoke (Chrome, synthetic data, axe)
        run: node tests/browser_smoke.cjs
        env:
          GYM_BROWSER: /usr/bin/google-chrome
          AXE_PATH: ${{ runner.temp }}/axe/node_modules/axe-core/axe.min.js

  browser-smoke-windows:
    name: Real-browser UI smoke (Edge, Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: gym-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.23"
      - run: uv sync --locked
      - name: Windows launcher previews and native signature verification
        run: uv run --no-sync pytest -q tests/test_collector_startup.py tests/test_release_signing.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: node tests/browser_smoke.cjs

  supply-chain:
    name: Secrets and dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan history for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.23"
      - name: Python dependencies (pip-audit)
        working-directory: gym-core
        run: |
          uv export --locked --no-hashes --no-emit-project --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --strict -r "$RUNNER_TEMP/requirements.txt"
      - uses: taiki-e/install-action@f84dff0ad3f25ff0e5dc531e626734a4e7d11ac7 # cargo-audit
      - name: Rust dependencies (cargo audit)
        run: cargo audit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Node dependencies (npm audit)
        working-directory: model-gateway
        run: npm audit --omit=dev --audit-level=high

  mutation-critical:
    name: Mutation regression gate (critical cohort)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: gym-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.23"
      - run: uv sync --locked --group dev
      - run: uv run --with 'mutmut[patch]==2.5.1' python scripts/mutation_gate.py --output "$RUNNER_TEMP/mutation-critical"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-critical-evidence
          path: ${{ runner.temp }}/mutation-critical/
          if-no-files-found: error

  mutation:
    name: Extended mutation assessment of money and statistics (weekly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gym-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.23"
      - run: uv sync --locked --group dev
      # This broader five-file assessment is not the critical-cohort baseline; failures remain visible.
      - name: Record weekly source, test, configuration and tool identities
        run: |
          mkdir -p "$RUNNER_TEMP/mutation-weekly"
          git rev-parse HEAD > "$RUNNER_TEMP/mutation-weekly/source-commit.txt"
          sha256sum src/gym/domain/*.py tests/*.py pyproject.toml uv.lock > "$RUNNER_TEMP/mutation-weekly/input-sha256.txt"
          uv run --with mutmut==2.5.1 python -c 'import mutmut,sys; from pathlib import Path; from importlib.metadata import version; from hashlib import sha256; print(sys.version); print("mutmut",version("mutmut")); p=Path(mutmut.__file__).parent; [print(name,sha256((p/name).read_bytes()).hexdigest()) for name in ("__init__.py","__main__.py","cache.py")]' > "$RUNNER_TEMP/mutation-weekly/tool-identity.txt"
      - name: Run complete weekly assessment and preserve its original exit
        run: |
          paths="src/gym/domain/performance.py,src/gym/domain/sim.py,src/gym/domain/portfolio.py,src/gym/domain/portfolio_policy.py,src/gym/domain/margin.py"
          runner="python -m pytest -x -q tests/test_performance.py tests/test_simulation.py tests/test_run_identity_golden.py tests/test_portfolio.py tests/test_portfolio_policy.py tests/test_margin.py tests/test_margin_depth_valuation.py tests/test_honest_sharpe.py tests/test_open_time_annualization.py tests/test_research_diagnostics.py tests/test_paper_sweep.py tests/test_mutation_contracts.py"
          printf '%s\n' "mutmut==2.5.1" "paths=$paths" "tests-dir=tests" "runner=$runner" > "$RUNNER_TEMP/mutation-weekly/configuration.txt"
          set +e
          uv run --with mutmut==2.5.1 mutmut run --paths-to-mutate "$paths" --tests-dir tests --runner "$runner" > "$RUNNER_TEMP/mutation-weekly/mutmut.log" 2>&1
          result=$?
          printf '{"exit_code":%s}\n' "$result" > "$RUNNER_TEMP/mutation-weekly/exit.json"
          cat "$RUNNER_TEMP/mutation-weekly/mutmut.log"
          exit "$result"
      - name: Preserve weekly cache and rendered results
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/mutation-weekly"
          for cache in .mutmut-cache .mutmut-cache-wal .mutmut-cache-shm .mutmut-cache-journal; do
            if [ -f "$cache" ]; then cp "$cache" "$RUNNER_TEMP/mutation-weekly/$cache"; fi
          done
          if [ -f .mutmut-cache ]; then
            uv run --with mutmut==2.5.1 mutmut results > "$RUNNER_TEMP/mutation-weekly/results.txt" 2>&1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-weekly-evidence
          path: ${{ runner.temp }}/mutation-weekly/
          include-hidden-files: true
          if-no-files-found: error

  sbom:
    # G-5: CycloneDX 1.5 SBOMs for the three ecosystems, built from the lockfiles on every run.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; version pinned below
        with:
          toolchain: 1.96.0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.23"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: mkdir -p sbom
      - run: uv export --project gym-core --locked --format cyclonedx1.5 --no-dev -o sbom/python.cdx.json
      - run: npm ci --ignore-scripts --prefix model-gateway
      - run: npm sbom --prefix model-gateway --sbom-format cyclonedx --omit dev > sbom/node.cdx.json
      - run: python3 scripts/cargo_sbom.py -o sbom/rust.cdx.json
      - name: Every SBOM is CycloneDX and non-empty
        run: >-
          python3 -c "import json,glob; files=sorted(glob.glob('sbom/*.json')); assert len(files)==3, files;
          [print(f, len(json.load(open(f))['components'])) or None for f in files];
          assert all(json.load(open(f))['bomFormat']=='CycloneDX' and json.load(open(f))['components'] for f in files)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/

  rust-kernel:
    # ADR 0005 stage 3: the simulator on the exec-core Rust kernel must pass the whole suite and match the Python path.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: gym-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; version pinned below
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.23"
      - run: cargo fmt --manifest-path ../executor/exec-kernel-py/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path ../executor/exec-kernel-py/Cargo.toml -- -D warnings
      - run: uv sync --locked --group dev
      - run: uvx --from "maturin>=1.7,<2" maturin build --release -m ../executor/exec-kernel-py/Cargo.toml -o dist
      - run: uv pip install --no-deps dist/*.whl
      - name: Whole suite on the Rust kernel
        run: GYM_RUST_KERNEL=1 uv run --no-sync pytest -q

  model-gateway:
    name: Advisory model gateway (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: model-gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: npm ci --ignore-scripts
      - run: npm test

  windows-vm-smoke:
    name: Disposable Windows SCM + access-control integration
    # Never install services while processing untrusted pull_request code.
    if: (github.event_name == 'push' || github.event_name == 'schedule') && github.repository == 'AmirrezaFarnamTaheri/Trade'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; version pinned below
        with:
          toolchain: 1.96.0
      - name: Start the host-instance rebuild clock (O-5)
        shell: pwsh
        run: '"REBUILD_STARTED=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV'
      - name: Build read-only service and every protected helper using pinned dependencies
        run: cargo build --release --locked -p exec-svc --bins
      - name: Verify service identity, DACL and two non-admin OS principals
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/windows/Test-ReadOnlyExecutorOnHostedVm.ps1 -BinaryPath ./target/release/gym-executor.exe
      - name: Record the host-instance rebuild time (clean VM to verified DISARMED)
        shell: pwsh
        run: |
          $seconds = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [int64]$env:REBUILD_STARTED
          "Host-instance rebuild: clean VM -> built -> installed -> started -> DISARMED verified in $seconds s" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

  b3-synthetic-produce:
    name: B3 encrypt synthetic ledger on Linux runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.23"
      - name: Install reviewed Python lock
        working-directory: gym-core
        run: uv sync --locked --group dev
      - name: Create encrypted synthetic archive (no credentials)
        working-directory: gym-core
        run: uv run python scripts/restore_portability_probe.py produce "$RUNNER_TEMP/b3-demo.tgbak"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: b3-ci-synthetic-archive
          path: ${{ runner.temp }}/b3-demo.tgbak
          if-no-files-found: error
          retention-days: 1

  b3-synthetic-restore:
    name: B3 decrypt and verify on independent Windows runner
    needs: b3-synthetic-produce
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.23"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: b3-ci-synthetic-archive
          path: ${{ runner.temp }}/b3-input
      - name: Restore and verify exact event chain on new Windows instance
        shell: pwsh
        working-directory: gym-core
        run: |
          uv sync --locked --group dev
          uv run python scripts/restore_portability_probe.py restore "$env:RUNNER_TEMP\b3-input\b3-demo.tgbak" "$env:RUNNER_TEMP\b3-restored\exec_ledger.db"
